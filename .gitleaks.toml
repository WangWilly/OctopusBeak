title = "Octopus Beak Gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "local build output, data and sessions"
paths = [
  '''^\.env$''',
  '''^\.svelte-kit/''',
  '''^node_modules/''',
  '''^build/''',
  '''^downloads/''',
  '''^data/''',
  '''^\.libretto/sessions/''',
  '''^\.libretto/profiles/''',
]

# Commit goldens record E.SUN card instrument fingerprints, HMACs of a synthetic
# secret that the generic key rule reads as API keys.
[[allowlists]]
description = "E.SUN instrument fingerprints in commit goldens"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^src/workflows/(?:deposit|credit-card)-commit-goldens/[^/]+\.json$''']
regexes = ['''^esun_instrument_[A-Za-z0-9_-]+$''']

[[rules]]
id = "libretto-cloud-credential"
description = "Libretto workflow credential pasted into source or docs"
regex = '''(?i)\b(LIBRETTO_CLOUD_[A-Z0-9_]*(?:PASSWORD|ACCOUNT|USER_ID|SECRET|TOKEN|API_KEY|CA_PASSWORD|CA_PATH)[ \t]*[:=][ \t]*["']?)([^"'\s,#]+)'''
secretGroup = 2
keywords = ["LIBRETTO_CLOUD_"]

[[rules.allowlists]]
description = "ignore placeholders"
stopwords = ["...", "example", "changeme", "redacted", "string", "<redacted>", "<secret>", "<password>", "<token>"]

[[rules]]
id = "max-api-credential"
description = "MAX/MaiCoin API credential pasted into source or docs"
regex = '''(?i)\b(MAX_(?:ACCESS_KEY|SECRET_KEY)[ \t]*[:=][ \t]*["']?)([^"'\s,#]+)'''
secretGroup = 2
keywords = ["MAX_ACCESS_KEY", "MAX_SECRET_KEY"]

[[rules.allowlists]]
description = "ignore placeholders"
stopwords = ["...", "example", "changeme", "redacted", "string", "<redacted>", "<secret>", "<password>", "<token>"]
