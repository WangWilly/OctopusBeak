        const BAR_W = (IN[1] - IN[0]) * S;
        const SEG = { // [x0, x1) in screenshot pixels
          salary: [178, 2080], interest: [2083, 2122],
          home: [178, 815], transport: [819, 922], dining: [926, 1002], daily: [1005, 1069],
          shopping: [1072, 1111], leisure: [1115, 1153], kept: [1156, 2122]
        };
        function placeBar(id, seg, row) {
          const el = $(id);
          el.style.left = fx(seg[0]) + "px"; el.style.width = ((seg[1] - seg[0]) * S) + "px";
          el.style.top = fy(row[0]) + "px"; el.style.height = ((row[1] - row[0]) * S) + "px";
          el.style.lineHeight = ((row[1] - row[0]) * S) + "px";
        }
        placeBar("f02-bar-salary", SEG.salary, IN);
        placeBar("f02-bar-interest", SEG.interest, IN);
        for (const k of ["home", "transport", "dining", "daily", "shopping", "leisure", "kept"]) placeBar("f02-bar-" + k, SEG[k], OUT);
        // in-bar labels exactly as 03-close draws them at its start: 10.4px 700, left x=130.47, vertically centred
        placeBar("f02-bar-salary-lbl", [196.5, 2080], IN);
        placeBar("f02-bar-home-lbl", [196.5, 815], OUT);
        placeBar("f02-bar-kept-lbl", SEG.kept, OUT);

        // ── eases ──
        const E = {
          p1io: gsap.parseEase("power1.inOut"), p2io: gsap.parseEase("power2.inOut"),
          p2o: gsap.parseEase("power2.out"), p3o: gsap.parseEase("power3.out"), lin: (x) => x
        };
        const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
        const prog = (t, t0, dur, ease) => (ease || E.lin)(clamp01((t - t0) / dur));
        const lerp = (a, b, p) => a + (b - a) * p;
        const mixColor = (a, b, p) => gsap.utils.interpolate(a, b, p);

        // ── geometry: cubic chains ──
        const straight = (x0, y0, x1, y1) => [x0, y0, x0 + (x1 - x0) / 3, y0 + (y1 - y0) / 3, x0 + 2 * (x1 - x0) / 3, y0 + 2 * (y1 - y0) / 3, x1, y1];
        const lerpChain = (A, B, p) => A.map((seg, i) => seg.map((v, j) => lerp(v, B[i][j], p)));
        const lerpChainXY = (A, B, px, py) => A.map((seg, i) => seg.map((v, j) => lerp(v, B[i][j], j % 2 ? py : px)));
        function cubicAt(c, u) {
          const mu = 1 - u;
          return [mu * mu * mu * c[0] + 3 * mu * mu * u * c[2] + 3 * mu * u * u * c[4] + u * u * u * c[6],
            mu * mu * mu * c[1] + 3 * mu * mu * u * c[3] + 3 * mu * u * u * c[5] + u * u * u * c[7]];
        }
        function sampleChain(chain, n, u1) {
          const pts = [], nrm = [];
          const total = chain.length;
          const steps = Math.max(1, Math.ceil(n * total * u1));
          let lnx = 0, lny = 1;
          for (let s = 0; s <= steps; s++) {
            const U = (s / steps) * u1 * total;
            const si = Math.min(total - 1, Math.floor(U));
            const u = U - si;
            const c = chain[si];
            const mu = 1 - u;
            const p = cubicAt(c, u);
            let tx = 3 * mu * mu * (c[2] - c[0]) + 6 * mu * u * (c[4] - c[2]) + 3 * u * u * (c[6] - c[4]);
            let ty = 3 * mu * mu * (c[3] - c[1]) + 6 * mu * u * (c[5] - c[3]) + 3 * u * u * (c[7] - c[5]);
            const L = Math.hypot(tx, ty);
            if (L > 1e-6) { lnx = -ty / L; lny = tx / L; }
            pts.push(p[0], p[1]); nrm.push(lnx, lny);
          }
          return { pts, nrm };
        }
        const f1 = (v) => Math.round(v * 10) / 10;
        function polyline(sm, d) {
          const p = sm.pts, n = sm.nrm;
          let s = "";
          for (let i = 0; i < p.length; i += 2) s += (i ? "L" : "M") + f1(p[i] + n[i] * d) + " " + f1(p[i + 1] + n[i + 1] * d);
          return s;
        }
        function bodyPath(sm, w) {
          const p = sm.pts, n = sm.nrm, h = w / 2;
          let s = "";
          for (let i = 0; i < p.length; i += 2) s += (i ? "L" : "M") + f1(p[i] - n[i] * h) + " " + f1(p[i + 1] - n[i + 1] * h);
          for (let i = p.length - 2; i >= 0; i -= 2) s += "L" + f1(p[i] + n[i] * h) + " " + f1(p[i + 1] + n[i + 1] * h);
          return s + "Z";
        }

        // ── engraved band: filled body + 1.2px lines every 7px along the flow ──
        // Flowing down, the normal points to −x, so a lane at offset d sits at x = centre − d. A global x grid
        // (x = 754 − 7k) keeps the trunk's lanes continuous into the 留下來 band and the tributaries.
        const GRIDX = 754;
        function makeBand(parent, o) {
          const g = document.createElementNS(NS, "g");
          parent.appendChild(g);
          const body = document.createElementNS(NS, "path");
          g.appendChild(body);
          const lg = document.createElementNS(NS, "g");
          lg.setAttribute("fill", "none"); lg.setAttribute("stroke-width", "1.2");
          lg.setAttribute("stroke-dasharray", "64 7");
          g.appendChild(lg);
          const offs = [];
          if (o.W >= 10) {
            if (o.gridX != null) {
              for (let x = GRIDX - 7 * 140; x < 1200; x += 7) {
                const d = o.gridX - x;
                if (Math.abs(d) <= o.W / 2 - 2.5) offs.push(d);
              }
            } else {
              for (let d = -o.W / 2 + 3.5; d <= o.W / 2 - 2.5; d += 7) offs.push(d);
            }
          }
          const lines = offs.map((d, k) => {
            const p = document.createElementNS(NS, "path");
            lg.appendChild(p);
            return { el: p, d, phase: ((k * 23) % 71) };
          });
          const edges = [];
          if (o.edges) for (let i = 0; i < 2; i++) {
            const e = document.createElementNS(NS, "path");
            e.setAttribute("fill", "none");
            g.appendChild(e);
            edges.push(e);
          }
          return { g, body, lg, lines, edges, o, last: {} };
        }
        // state: {chain, w, u (draw progress), fill, line, lineOp, edge, edgeOp, edgeW, op}
        function drawBand(b, st, t) {
          const sm = sampleChain(st.chain, b.o.n, st.u);
          const visible = st.u > 0.0005 && st.op > 0.001;
          b.g.setAttribute("opacity", visible ? f1(st.op * 1000) / 1000 : 0);
          if (!visible) return;
          b.body.setAttribute("d", bodyPath(sm, st.w));
          b.body.setAttribute("fill", st.fill);
          const showLines = st.lineOp > 0.001;
          b.lg.setAttribute("opacity", showLines ? f1(st.lineOp * 1000) / 1000 : 0);
          if (showLines) {
            b.lg.setAttribute("stroke", st.line);
            const k = st.w / b.o.W;
            const flow = -40 * t;
            for (const L of b.lines) {
              L.el.setAttribute("d", polyline(sm, L.d * k));
              L.el.setAttribute("stroke-dashoffset", f1(L.phase + flow));
            }
          }
          if (b.edges.length) {
            const show = st.edgeOp > 0.001;
            for (let i = 0; i < 2; i++) {
              const e = b.edges[i];
              e.setAttribute("opacity", show ? f1(st.edgeOp * 1000) / 1000 : 0);
              if (!show) continue;
              e.setAttribute("d", polyline(sm, (i ? 1 : -1) * st.w / 2));
              e.setAttribute("stroke", st.edge);
              e.setAttribute("stroke-width", st.edgeW);
              if (st.edgeDash) e.setAttribute("stroke-dasharray", st.edgeDash);
            }
          }
        }

        // ── palette ──
        const C = {
          salary: "#285d3f", interest: "#76527c", home: "#7d4a40", transport: "#915d2a", dining: "#266299",
          daily: "#186e57", shopping: "#76527c", leisure: "#2a5e6a", keptFill: "#ebf0ed",
          ribbon: "rgba(44, 100, 133, 0.85)", ribbonPale: "rgba(223, 238, 248, 1)", lineW: "rgba(255, 255, 255, 0.22)",
          lineG: "rgba(40, 93, 63, 0.18)"
        };

        // ── river layout (1px = 200 TWD) ──
        // 薪資 435px enters from the left edge at y 790–1225 and pivots about the inner corner (322.5, 1225) into a
        // vertical trunk x 322.5–757.5 (every engraving lane is a quarter circle about that corner).
        // Below y=1225 the trunk is already two pieces: 留下來 216px (x 322.5–538.5) and 流出 219px (x 538.5–757.5),
        // so the split in scenes 4–5 needs no re-cut.
        const K = 0.5523 * 217.5;
        const trunkA0 = [
          straight(-40, 1007.5, 322.5, 1007.5),
          [322.5, 1007.5, 322.5 + K, 1007.5, 540, 1225 - K, 540, 1225],
          straight(540, 1225, 540, 1242)
        ];
        const L_H = 362.5, L_ARC = 341.6, L_STUB = 17, L_PIECE = 735, SEAM = L_H + L_ARC;
        const TRIBS = [ // name, width, start centre x at y=1225, end (x, y) centre, ends horizontally at x=1040 unless home
          ["home", 147, 612, 627, 1560], ["transport", 24, 697.5, 1040, 1546], ["dining", 17, 718, 1040, 1489.5],
          ["daily", 14, 733.5, 1040, 1440], ["shopping", 9, 745, 1040, 1394.5], ["leisure", 8, 753.5, 1040, 1352]
        ];
        const gTrunk = $("f02-g-trunk"), gInt = $("f02-g-interest"), gRib = $("f02-g-ribbons");
        const trunkA = makeBand(gTrunk, { W: 435, gridX: 540, n: 24 });
        const kept = makeBand(gTrunk, { W: 216, gridX: 430.5, n: 1, edges: true });
        const tribs = TRIBS.map(([name, w, sx, ex, ey]) => ({
          name, w, sx, ex, ey,
          band: makeBand(gTrunk, { W: w, gridX: sx, n: 30 })
        }));
        tribs.slice().reverse().forEach((tb) => gTrunk.appendChild(tb.band.g)); // 居家 drawn last (on top)
        const interest = makeBand(gInt, { W: 4, n: 30 });

        const trunkA1 = [
          straight(fx(SEG.salary[0]), CY_IN, lerp(fx(SEG.salary[0]), fx(SEG.salary[1]), 0.45), CY_IN),
          straight(lerp(fx(SEG.salary[0]), fx(SEG.salary[1]), 0.45), CY_IN, lerp(fx(SEG.salary[0]), fx(SEG.salary[1]), 0.97), CY_IN),
          straight(lerp(fx(SEG.salary[0]), fx(SEG.salary[1]), 0.97), CY_IN, fx(SEG.salary[1]), CY_IN)
        ];
        const kept0 = [straight(430.5, 1225, 430.5, 1960)];
        const keptPool = [straight(430.5, 1225, 430.5, 1346)];
        const kept1 = [straight(fx(SEG.kept[0]), CY_OUT, fx(SEG.kept[1]), CY_OUT)];
        const int0 = [[-30, 1292, 120, 1292, 220, 1244, 318, 1240], [318, 1240, 352, 1238, 372, 1206, 396, 1160]]; // merges under the trunk
        const ix0 = fx(SEG.interest[0]), ix1 = fx(SEG.interest[1]);
        const int1 = [[ix0, CY_IN, ix0, CY_IN, ix0, CY_IN, ix0, CY_IN], straight(ix0, CY_IN, ix1, CY_IN)];
        for (const tb of tribs) {
          tb.c0 = [straight(tb.sx, 1225, tb.sx, 1960)];
          tb.c1 = tb.name === "home"
            ? [[tb.sx, 1225, tb.sx, 1380, tb.ex, 1400, tb.ex, 1560]]
            : [[tb.sx, 1225, tb.sx, lerp(1225, tb.ey, 0.72), lerp(tb.sx, 1040, 0.3), tb.ey, 1040, tb.ey]];
          tb.c2 = [straight(fx(SEG[tb.name][0]), CY_OUT, fx(SEG[tb.name][1]), CY_OUT)];
        }
        // labels at the tributary ends
        $("f02-lbl-home").style.left = (627 - 73.5) + "px";
        const CHIP_TOP = { transport: 1504, dining: 1451, daily: 1403, shopping: 1360, leisure: 1318 };
        for (const k in CHIP_TOP) $("f02-chip-" + k).style.top = CHIP_TOP[k] + "px";

        // ribbons (half scale, 1px = 400 TWD)
        const ribA = { band: makeBand(gRib, { W: 75, n: 60 }), chain: [[560, 840, 600, 660, 880, 640, 950, 870]], w: 75 };
        const ribB = { band: makeBand(gRib, { W: 80, n: 40 }), chain: [[700, 1050, 790, 1040, 870, 1090, 950, 1090], [950, 1090, 1015, 1095, 1015, 1245, 950, 1250]], w: 80 };
        const gC = document.createElementNS(NS, "g");
        gC.setAttribute("mask", "url(#f02-fade-mask)");
        gRib.appendChild(gC);
        const ribC1 = { band: makeBand(gC, { W: 30, n: 50, edges: true }), chain: [[520, 850, 470, 700, 300, 662, -40, 652]], w: 30 };
        const ribC2 = { band: makeBand(gC, { W: 30, n: 50, edges: true }), chain: [[555, 845, 520, 690, 360, 628, -40, 618]], w: 30 };

        // seal on ribbon (a) near its crest
        (function () {
          const p = cubicAt(ribA.chain[0], 0.6);
          const el = $("f02-seal-a");
          el.style.left = f1(p[0]) + "px"; el.style.top = f1(p[1]) + "px";
        })();
        gsap.set(['[id="f02-seal-a"]', '[id="f02-pill-b"]', '[id="f02-pill-c"]'], { xPercent: -50, yPercent: -50 });

        // pool engraving (static horizontal lines)
        (function () {
          const pl = $("f02-pool-lines");
          for (let y = 1343; y < 1560; y += 7) {
            const l = document.createElementNS(NS, "line");
            l.setAttribute("x1", 80); l.setAttribute("x2", 540);
            l.setAttribute("y1", y); l.setAttribute("y2", y);
            l.setAttribute("stroke", C.lineG); l.setAttribute("stroke-width", "1.2");
            pl.appendChild(l);
          }
        })();

        // ── timing (composition seconds) — identical to the 16:9 river ──
        const T = {
          drawAt: 0.9, drawDur: 1.8,          // trunk draws on along the flow
          intAt: 1.3, intDur: 1.0,            // 利息 strand
          ribA: 5.7, ribB: 6.9, ribC: 8.1,    // ribbon ticks (film 10.2 / 11.4 / 12.6)
          ribDur: 0.8,
          pale: 8.6, fly: 9.0, flyDur: 1.2,
          trib: 11.0, tribStep: 0.15, tribDur: 1.3,
          keptTurn: 15.7, keptRetract: 15.8, pool: 16.0, water: 16.45, waterDur: 0.95,
          morph: 19.8, morphDur: 1.2
        };
        // water front, in px of flow length from the left edge
        const FRONT_END = SEAM + L_PIECE + 20;
        const front = (t) => -20 + (FRONT_END + 20) * prog(t, T.drawAt, T.drawDur, E.p1io);
        function trunkU(s) {
          if (s <= 0) return 0;
          if (s < L_H) return (s / L_H) / 3;
          if (s < SEAM) return (1 + (s - L_H) / L_ARC) / 3;
          return (2 + clamp01((s - SEAM) / L_STUB)) / 3;
        }
        const pieceU = (s) => clamp01((s - SEAM) / L_PIECE);
        function frontTime(s) { // when the water front reaches flow length s (for node pulses)
          let lo = T.drawAt, hi = T.drawAt + T.drawDur;
          for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (front(m) < s) lo = m; else hi = m; }
          return lo;
        }

        // ── nodes: pulse when the water reaches them ──
        const NODES = [
          { id: "f02-n7036", s: L_H + 0.45 * L_ARC }, { id: "f02-n7819", s: L_H + 0.8 * L_ARC }, { id: "f02-nesun", s: SEAM + 25 }
        ].map((n) => ({ disc: $(n.id).querySelector(".f02-disc"), ring: $(n.id).querySelector(".f02-ring"), at: frontTime(n.s) }));

        const NLABELS = [["f02-n7028", 540, 830], ["f02-n7036", 950, 900], ["f02-n7819", 950, 1090], ["f02-nesun", 648, 1250]]
          .map(([id, x, y]) => ({ el: $(id).querySelector(".f02-nlabel span"), dist: Math.hypot(x - 540, y + 66 - 830), k: -1 }));

        // ── counters: stepped odometers (24 discrete steps) ──
        const odo = (target, p) => Math.round(target * Math.floor(p * 24 + 1e-9) / 24).toLocaleString("en-US");
        const CN = [
          { el: $("f02-cn-in"), at: 1.0, dur: 1.6, target: 86912 },
          { el: $("f02-cn-out"), at: 11.2, dur: 1.6, target: 43744 },
          { el: $("f02-cn-kept"), at: 16.4, dur: 1.4, target: 43168 }
        ];
        CN.forEach((c) => { c.last = null; });

        // ── render the whole river from time ──
        const waterR = $("f02-pool-water-r");
        const surface = $("f02-pool-surface");
        function render(t) {
          const m = prog(t, T.morph, T.morphDur, E.p2io);          // river → bars
          const engr = 1 - prog(t, T.morph, 0.45, E.lin);           // engraving fades to flat
          const lastFade = t < T.morph + T.morphDur ? 1 : 0; // exact bars fade in on top, then take over
          // morph staging: trunk, 利息 and 留下來 compress vertically first, then stretch to their x;
          // tributaries swing over first, then settle into the outflow row
          const mA = prog(t, T.morph, T.morphDur * 0.55, E.p2io);
          const mB = prog(t, T.morph + T.morphDur * 0.25, T.morphDur * 0.75, E.p2io);
          const mC = prog(t, T.morph, T.morphDur * 0.75, E.p2io);
          const mD = prog(t, T.morph + T.morphDur * 0.3, T.morphDur * 0.7, E.p2io);
          const s = front(t);

          // trunk
          drawBand(trunkA, {
            chain: lerpChainXY(trunkA0, trunkA1, mB, mA), w: lerp(435, BAR_W, mA), u: m > 0 ? 1 : trunkU(s),
            fill: C.salary, line: C.lineW, lineOp: engr, op: lastFade
          }, t);

          // 利息 strand
          drawBand(interest, {
            chain: lerpChainXY(int0, int1, mB, mA), w: lerp(4, BAR_W, mB), u: Math.max(prog(t, T.intAt, T.intDur, E.p2io), m > 0 ? 1 : 0),
            fill: C.interest, line: C.lineW, lineOp: 0, op: lastFade
          }, t);

          // tributaries peel off and fan
          const pu = m > 0 ? 1 : pieceU(s);
          tribs.forEach((tb, i) => {
            const a = prog(t, T.trib + i * T.tribStep, T.tribDur, E.p2io);
            const chain = m > 0 ? lerpChainXY(tb.c1, tb.c2, mD, mC) : lerpChain(tb.c0, tb.c1, a);
            drawBand(tb.band, {
              chain, w: lerp(tb.w, BAR_W, mD), u: pu,
              fill: mixColor(C.salary, C[tb.name], a), line: C.lineW, lineOp: engr, op: lastFade
            }, t);
          });

          // 留下來 band
          const kc = prog(t, T.keptTurn, 0.6, E.p2io);
          const kr = prog(t, T.keptRetract, 0.7, E.p2io);
          drawBand(kept, {
            chain: m > 0 ? lerpChainXY(keptPool, kept1, mB, mA) : lerpChain(kept0, keptPool, kr),
            w: lerp(216, BAR_W, mA), u: pu,
            fill: mixColor(C.salary, C.keptFill, kc),
            line: kc < 0.5 ? C.lineW : C.lineG, lineOp: engr * Math.abs(1 - 2 * kc),
            edge: "rgb(40, 93, 63)", edgeOp: kc * (1 - m) + m * 0.55, edgeW: lerp(2, 0.8, m), op: lastFade
          }, t);

          // pool: wall draws, water rises
          const pw = prog(t, T.pool, 0.6, E.p2io);
          const wr = prog(t, T.water, T.waterDur, E.p3o);
          const poolOp = (t >= T.pool ? 1 : 0) * (1 - prog(t, T.morph, 0.5, E.lin));
          $("f02-g-pool").setAttribute("opacity", poolOp);
          const wall = $("f02-pool-wall");
          wall.setAttribute("stroke-dasharray", "1200 1200");
          wall.setAttribute("stroke-dashoffset", f1(1200 * (1 - pw)));
          const wy = lerp(1560, 1338, wr);
          waterR.setAttribute("y", f1(wy)); waterR.setAttribute("height", f1(1562 - wy));
          surface.setAttribute("y1", f1(wy)); surface.setAttribute("y2", f1(wy));
          surface.setAttribute("opacity", wr > 0 && wr < 1 ? 1 : 0);

          // transfer ribbons
          const pale = prog(t, T.pale, 0.4, E.lin);
          const ribFill = mixColor(C.ribbon, C.ribbonPale, pale);
          const ribLine = 1 - pale;
          for (const [r, at] of [[ribA, T.ribA], [ribB, T.ribB]]) {
            drawBand(r.band, { chain: r.chain, w: r.w, u: prog(t, at, T.ribDur, E.p2io), fill: ribFill, line: C.lineW, lineOp: ribLine, op: 1 }, t);
          }
          for (const [r, d] of [[ribC1, 0], [ribC2, 0.12]]) {
            drawBand(r.band, {
              chain: r.chain, w: r.w, u: prog(t, T.ribC + d, T.ribDur, E.p2io),
              fill: mixColor("rgba(44, 100, 133, 0.5)", C.ribbonPale, pale), line: C.lineW, lineOp: ribLine,
              edge: "#2c6485", edgeOp: 1 - pale, edgeW: 1.6, edgeDash: "7 5", op: 1
            }, t);
          }

          // node pulses
          for (const n of NODES) {
            const k = (t - n.at) / 0.6;
            if (k > 0 && k < 1) {
              n.disc.style.transform = "scale(" + (1 + 0.12 * Math.sin(Math.PI * k)).toFixed(4) + ")";
              n.ring.style.transform = "scale(" + (1 + 0.6 * k).toFixed(4) + ")";
              n.ring.style.opacity = (0.8 * (1 - k)).toFixed(4);
            } else {
              n.disc.style.transform = "none"; n.ring.style.opacity = "0";
            }
          }

          // node labels: white on night → ink on a paper chip as the wipe edge passes
          const wipeR = 2300 * prog(t, 0, 0.9, E.p2io);
          for (const L of NLABELS) {
            const k = clamp01((wipeR - L.dist + 40) / 80);
            if (k !== L.k) {
              L.k = k;
              L.el.style.color = mixColor("#ffffff", "#0e1217", k);
              L.el.style.backgroundColor = "rgba(249, 250, 252, " + (0.9 * k).toFixed(3) + ")";
            }
          }

          // odometers
          for (const c of CN) {
