        const TRIBS = [ // name, width, start centre x at y=1225 (the 流出 group starts 3px inside 留下來, as in 16:9, so no bank shows between them), end (x, y) centre; thin ones end pointing right at x=1040
          ["home", 147, 609, 627, 1560], ["transport", 24, 694.5, 1040, 1546], ["dining", 17, 715, 1040, 1489.5],
          ["daily", 14, 730.5, 1040, 1440], ["shopping", 9, 742, 1040, 1394.5], ["leisure", 8, 750.5, 1040, 1352]
        ];
        const tribs = TRIBS.map(([name, w, sx, ex, ey]) => ({ name, w, sx, ex, ey }));

        const sx0 = fx(SEG.salary[0]), sx1 = fx(SEG.salary[1]);
        const trunkA1 = [
          straight(sx0, CY_IN, lerp(sx0, sx1, 0.45), CY_IN),
          straight(lerp(sx0, sx1, 0.45), CY_IN, lerp(sx0, sx1, 0.97), CY_IN),
          straight(lerp(sx0, sx1, 0.97), CY_IN, sx1, CY_IN)
        ];
        const kept0 = [straight(430.5, 1225, 430.5, 1960)];
        const keptPool = [straight(430.5, 1225, 430.5, 1346)];
        const kept1 = [straight(fx(SEG.kept[0]), CY_OUT, fx(SEG.kept[1]), CY_OUT)];
        const int0 = [[-30, 1292, 120, 1292, 220, 1244, 318, 1240], [318, 1240, 352, 1238, 372, 1206, 396, 1160]]; // merges under the trunk
        const ix0 = fx(SEG.interest[0]), ix1 = fx(SEG.interest[1]);
        const int1 = [[ix0, CY_IN, ix0, CY_IN, ix0, CY_IN, ix0, CY_IN], straight(ix0, CY_IN, ix1, CY_IN)];
        for (const tb of tribs) {
          tb.c0 = [straight(tb.sx, 1225, tb.sx, 1960)];
          tb.c1 = tb.name === "home"
            ? [[tb.sx, 1225, tb.sx, 1380, tb.ex, 1400, tb.ex, 1560]]
            : [[tb.sx, 1225, tb.sx, lerp(1225, tb.ey, 0.72), lerp(tb.sx, 1040, 0.3), tb.ey, 1040, tb.ey]];
          tb.c2 = [straight(fx(SEG[tb.name][0]), CY_OUT, fx(SEG[tb.name][1]), CY_OUT)];
        }
        // labels at the tributary ends
        $("f02-lbl-home").style.left = (627 - 73.5) + "px";
        const CHIP_TOP = { transport: 1504, dining: 1451, daily: 1403, shopping: 1360, leisure: 1318 };
        for (const k in CHIP_TOP) $("f02-chip-" + k).style.top = CHIP_TOP[k] + "px";

        // ribbons (half scale, 1px = 400 TWD) — also water, in the transfer blue
        const ribA = { chain: [[560, 840, 600, 660, 880, 640, 950, 870]], w: 75, n: 60 };
        const ribB = { chain: [[700, 1050, 790, 1040, 870, 1090, 950, 1090], [950, 1090, 1015, 1095, 1015, 1245, 950, 1250]], w: 80, n: 40 };
        const ribC1 = { chain: [[520, 850, 470, 700, 300, 662, -40, 652]], w: 30, n: 50 };
        const ribC2 = { chain: [[555, 845, 520, 690, 360, 628, -40, 618]], w: 30, n: 50 };

        // seal on ribbon (a) near its crest
        (function () {
          const p = cubicAt(ribA.chain[0], 0.6);
          const el = $("f02-seal-a");
          el.style.left = f1(p[0]) + "px"; el.style.top = f1(p[1]) + "px";
        })();
        gsap.set(['[id="f02-seal-a"]', '[id="f02-pill-b"]', '[id="f02-pill-c"]'], { xPercent: -50, yPercent: -50 });

        // ── timing (composition seconds) — identical to the 16:9 river ──
        const T = {
          drawAt: 0.9, drawDur: 1.8,          // trunk draws on along the flow
          intAt: 1.3, intDur: 1.0,            // 利息 strand
          ribA: 5.7, ribB: 6.9, ribC: 8.1,    // ribbon ticks (film 10.2 / 11.4 / 12.6)
          ribDur: 0.8,
          pale: 8.6, fly: 9.0, flyDur: 1.2,
          trib: 11.0, tribStep: 0.15, tribDur: 1.3,
          keptTurn: 15.7, keptRetract: 15.8, pool: 16.0, water: 16.45, waterDur: 0.95,
          morph: 19.8, morphDur: 1.2
        };
        // water front, in px of flow length from the left edge
        const FRONT_END = SEAM + L_PIECE + 20;
        const front = (t) => -20 + (FRONT_END + 20) * prog(t, T.drawAt, T.drawDur, E.p1io);
        function trunkU(s) { // draw progress along trunkExt (horizontal, bend, vertical run to the bottom edge)
          if (s <= 0) return 0;
          if (s < L_H) return (s / L_H) / 3;
          if (s < SEAM) return (1 + (s - L_H) / L_ARC) / 3;
          return (2 + clamp01((s - SEAM) / L_PIECE)) / 3;
        }
        const pieceU = (s) => clamp01((s - SEAM) / L_PIECE);
        function frontTime(s) { // when the water front reaches flow length s (for node pulses)
          let lo = T.drawAt, hi = T.drawAt + T.drawDur;
          for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (front(m) < s) lo = m; else hi = m; }
          return lo;
        }

        // ── nodes: pulse when the water reaches them ──
        const NODES = [
          { id: "f02-n7036", s: L_H + 0.45 * L_ARC }, { id: "f02-n7819", s: L_H + 0.8 * L_ARC }, { id: "f02-nesun", s: SEAM + 25 }
        ].map((n) => ({ disc: $(n.id).querySelector(".f02-disc"), ring: $(n.id).querySelector(".f02-ring"), at: frontTime(n.s) }));

        const NLABELS = [["f02-n7028", 540, 830], ["f02-n7036", 950, 900], ["f02-n7819", 950, 1090], ["f02-nesun", 648, 1250]]
          .map(([id, x, y]) => ({ el: $(id).querySelector(".f02-nlabel span"), dist: Math.hypot(x - 540, y + 66 - 830), k: -1 }));

        // ── counters: stepped odometers (24 discrete steps) ──
        const odo = (target, p) => Math.round(target * Math.floor(p * 24 + 1e-9) / 24).toLocaleString("en-US");
        const CN = [
          { el: $("f02-cn-in"), at: 1.0, dur: 1.6, target: 86912 },
          { el: $("f02-cn-out"), at: 11.2, dur: 1.6, target: 43744 },
          { el: $("f02-cn-kept"), at: 16.4, dur: 1.4, target: 43168 }
        ];
        CN.forEach((c) => { c.last = null; });

        // ── render the whole river from time ──
        const cvR = $("f02-river-cv"), cvBo = $("f02-rib-ov");
        const glR = makeWater($("f02-river-gl")), glB = makeWater($("f02-rib-gl"));
        const IR = makeInputs(), IB = makeInputs(), IT = makeInputs();
        const mkC = () => { const c = document.createElement("canvas"); c.width = CW; c.height = CH; return c; };
        const cvC = mkC(), cvCo = mkC(); // strands (c) colour and dashed banks, masked toward the left edge
        function render(t) {
          const m = prog(t, T.morph, T.morphDur, E.p2io);          // river → bars
          const lastFade = t < T.morph + T.morphDur ? 1 : 0; // exact bars fade in on top, then take over
          // morph staging: trunk, 利息 and 留下來 compress vertically first, then stretch to their x;
          // tributaries swing over first, then settle into the outflow row
          const mA = prog(t, T.morph, T.morphDur * 0.55, E.p2io);
          const mB = prog(t, T.morph + T.morphDur * 0.25, T.morphDur * 0.75, E.p2io);
          const mC = prog(t, T.morph, T.morphDur * 0.75, E.p2io);
          const mD = prog(t, T.morph + T.morphDur * 0.3, T.morphDur * 0.7, E.p2io);
          const s = front(t);

          const water = 1 - prog(t, T.morph, 0.45, E.lin);           // the water calms to flat bar colour
          const zf = (t0, t1) => clamp01(Math.min((t - t0) / 0.5, (t1 - t) / 0.5));
          clearInputs(IR);
          const ov = cvR.getContext("2d");
          ov.clearRect(0, 0, CW, CH);
          let poolU = null;
          if (lastFade) {
            // 利息 strand (under the trunk)
            emitBand(IR, null, {
              chain: lerpChainXY(int0, int1, mB, mA), n: 30, w: lerp(4, BAR_W, mB),
              u: Math.max(prog(t, T.intAt, T.intDur, E.p2io), m > 0 ? 1 : 0), fill: C.interest, vmax: 130
            });
            // pool: wall draws, water rises
            const pw = prog(t, T.pool, 0.6, E.p2io);
            const wr = prog(t, T.water, T.waterDur, E.p3o);
            const poolOp = (t >= T.pool ? 1 : 0) * (1 - prog(t, T.morph, 0.5, E.lin));
            emitPool(IR, ov, t, poolOp, pw, wr);
            if (wr > 0) poolU = [430.5, 1346, poolOp];

            const pu = m > 0 ? 1 : pieceU(s);
            const trunkSt = {
              chain: m > 0 ? lerpChainXY(trunkA0, trunkA1, mB, mA) : trunkExt, n: 24, w: lerp(435, BAR_W, mA),
              u: m > 0 ? 1 : trunkU(s), fill: C.salary, vmax: 92
            };
            // the trunk proper stops just past the fork (y 1285); below it the pieces carry on
            each(IR, (c) => { c.save(); if (m === 0) { c.beginPath(); c.rect(-60, -60, CW + 120, 1285 + 60); c.clip(); } });
            emitBand(IR, null, trunkSt);
            each(IR, (c) => c.restore());
            // 留下來 band
            const kc = prog(t, T.keptTurn, 0.6, E.p2io);
            const kr = prog(t, T.keptRetract, 0.7, E.p2io);
            emitBand(IR, ov, {
              chain: m > 0 ? lerpChainXY(keptPool, kept1, mB, mA) : lerpChain(kept0, keptPool, kr), n: 1,
              w: lerp(216, BAR_W, mA), u: pu, t,
              fill: mixColor(C.salary, C.keptFill, kc), vmax: lerp(92, 60, kc),
              parent: { off: 540 - 430.5, H: 217.5, w0: 216 }, join: 1 - prog(t, T.trib, T.tribDur, E.p2io),
              edge: "rgb(40, 93, 63)", edgeOp: kc * (1 - m) + m * 0.55, edgeW: lerp(2, 0.8, m)
            });
            // tributaries peel off and fan (居家 last, on top)
            for (let i = tribs.length - 1; i >= 0; i--) {
              const tb = tribs[i];
              const a = prog(t, T.trib + i * T.tribStep, T.tribDur, E.p2io);
              emitBand(IR, null, {
                chain: m > 0 ? lerpChainXY(tb.c1, tb.c2, mD, mC) : lerpChain(tb.c0, tb.c1, a), n: 30,
                w: lerp(tb.w, BAR_W, mD), u: pu,
                fill: mixColor(C.salary, C[tb.name], a), vmax: lerp(92, 100 + 40 * (1 - tb.w / 147), a),
                parent: { off: 540 - tb.sx, H: 217.5, w0: tb.w }, join: 1 - a
              });
            }
            // the fork: the trunk flows on over the branch heads and fades out over 60px below y 1225 (留下來 is only 121px long before the pool),
            // so colour, flow and banks blend into the branches instead of butting against them
            if (m === 0) {
              // the trunk's water recedes from the bottom edge back up to the fork as the branches peel away
              const Y = lerp(2080, 1225, prog(t, T.trib, 1.1, E.p2io));
              clearInputs(IT, true);
              each(IT, (c) => { c.save(); c.beginPath(); c.rect(-60, 1225, CW + 120, 900); c.clip(); });
              emitBand(IT, null, trunkSt);
              each(IT, (c) => c.restore());
              each(IT, (c) => {
                c.save();
                c.globalCompositeOperation = "destination-in";
                const gr = c.createLinearGradient(0, Y, 0, Y + 60);
                gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
                c.fillStyle = gr; c.fillRect(-60, -60, CW + 120, CH + 120);
                c.restore();
              });
              I_COMPOSE(IR, IT);
            }
          }
          const ZONES = lastFade ? [
            [540, 1240, 130, 0.9 * zf(2.6, T.morph)],          // the fork
            [330, 1238, 70, 0.8 * zf(2.1, T.morph)],           // 利息 joins
            [548, 850, 62, 0.9 * zf(5.7, 9.4)],                // ribbon (a) and strands (c) leave at 7028
            [705, 1050, 62, 0.9 * zf(6.9, 9.4)],               // ribbon (b) leaves toward 7819
            [430.5, 1346, 90, 0.5 * zf(15.9, T.morph)]         // 留下來 pours into the pool
          ] : [];
          glR.draw(IR, t, water, ZONES, poolU);

          // transfer ribbons (same water, in the transfer blue)
          const pale = prog(t, T.pale, 0.4, E.lin);
          clearInputs(IB);
          const rov = cvBo.getContext("2d");
          rov.clearRect(0, 0, CW, CH);
          const ribFill = mixColor(C.ribbon, C.ribbonPale, pale);
          for (const [r, at] of [[ribA, T.ribA], [ribB, T.ribB]]) {
            emitBand(IB, null, { chain: r.chain, n: r.n, w: r.w, u: prog(t, at, T.ribDur, E.p2io), fill: ribFill, vmax: 120 });
          }
          {
            const c = IB.col; c.save(); c.globalCompositeOperation = "destination-out";
            const gr = c.createRadialGradient(700, 1050, 30, 700, 1050, 110);
            gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
            c.fillStyle = gr; c.fillRect(560, 910, 280, 280); c.restore();
          }
          // unpaired strands: thinner water with dashed banks, evaporating toward the left edge
          const sc = cvC.getContext("2d"), so = cvCo.getContext("2d");
          sc.clearRect(0, 0, CW, CH); so.clearRect(0, 0, CW, CH);
          let anyC = false;
          const keepCol = IB.col; IB.col = sc; IB.all[0] = sc;
          for (const [r, d] of [[ribC1, 0], [ribC2, 0.12]]) {
            const u = prog(t, T.ribC + d, T.ribDur, E.p2io);
            if (u > 0) anyC = true;
            emitBand(IB, so, {
              chain: r.chain, n: r.n, w: r.w, u, t, fill: mixColor("rgba(44, 100, 133, 0.6)", C.ribbonPale, pale), vmax: 120,
              edge: "#2c6485", edgeOp: 1 - pale, edgeW: 1.6, edgeDash: [7, 5]
            });
          }
          IB.col = keepCol; IB.all[0] = keepCol;
          if (anyC) {
            for (const [c2, dst] of [[sc, IB.col], [so, rov]]) {
              c2.save();
              c2.globalCompositeOperation = "destination-in";
              const gr = c2.createLinearGradient(20, 0, 300, 0);
              gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,1)");
              c2.fillStyle = gr; c2.fillRect(0, 0, CW, CH);
              c2.restore();
              dst.drawImage(c2.canvas, 0, 0);
            }
          }
          glB.draw(IB, t, 1 - pale, [], null);

          // node pulses
          for (const n of NODES) {
            const k = (t - n.at) / 0.6;
            if (k > 0 && k < 1) {
              n.disc.style.transform = "scale(" + (1 + 0.12 * Math.sin(Math.PI * k)).toFixed(4) + ")";
              n.ring.style.transform = "scale(" + (1 + 0.6 * k).toFixed(4) + ")";
              n.ring.style.opacity = (0.8 * (1 - k)).toFixed(4);
            } else {
              n.disc.style.transform = "none"; n.ring.style.opacity = "0";
            }
          }

          // node labels: white on night → ink on a paper chip as the wipe edge passes
          const wipeR = 2300 * prog(t, 0, 0.9, E.p2io);
          for (const L of NLABELS) {
            const k = clamp01((wipeR - L.dist + 40) / 80);
            if (k !== L.k) {
              L.k = k;
              L.el.style.color = mixColor("#ffffff", "#0e1217", k);
              L.el.style.backgroundColor = "rgba(249, 250, 252, " + (0.9 * k).toFixed(3) + ")";
            }
          }

          // odometers
          for (const c of CN) {
            const txt = t < c.at ? "—" : odo(c.target, prog(t, c.at, c.dur, E.p2o));
            if (txt !== c.last) { c.el.textContent = txt; c.last = txt; }
          }
        }
        let drvT = 0;
        const driver = { get t() { return drvT; }, set t(x) { drvT = x; render(x); } };
        tl.fromTo(driver, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);

        // ── grounds ──
        tl.fromTo('[id="f02-night-rosette"]', { rotation: 0.6 * FILM_START }, { rotation: 0.6 * (FILM_START + DUR), duration: DUR, ease: "none" }, 0);
        tl.fromTo('[id="f02-paper-rosette"]', { rotation: 0.6 * FILM_START }, { rotation: 0.6 * (FILM_START + DUR), duration: DUR, ease: "none" }, 0);

        // ── Scene 1 (0.0–0.9): paper circle-wipes out from 富邦 7028 ──
        tl.fromTo('[id="f02-paper"]', { clipPath: "circle(0px at 540px 830px)" },
          { clipPath: "circle(2300px at 540px 830px)", duration: 0.9, ease: "power2.inOut" }, 0);
        tl.fromTo('[id="f02-counters"]', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.5);

        // ── headline wipes ──
        tl.fromTo('[id="f02-eyebrow"]', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.75);
        const HEADS = [["f02-h1", 0.85], ["f02-h2", 5.0], ["f02-h3", 10.5], ["f02-h4", 15.5]];
        HEADS.forEach(([id, at], i) => {
          tl.fromTo('[id="' + id + '"]', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at);
          const next = HEADS[i + 1];
          const outAt = next ? next[1] - 0.25 : 19.5;
          tl.to('[id="' + id + '"]', { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, outAt);
        });

        // ── Scene 2 (0.7–5.0): inflow ──
        tl.fromTo('[id="f02-lbl-salary"]', { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.4);
        tl.fromTo('[id="f02-lbl-interest"]', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.9);
        tl.to('[id="f02-cl-in"]', { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.0);
        tl.fromTo('[id="f02-cn-in"]', { opacity: 0.35, color: "#5e646a" }, { opacity: 1, color: "#285d3f", duration: 0.2, ease: "power1.out" }, 1.0);
        tl.fromTo('[id="f02-cs-in"]', { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.6);

        // ── Scene 3 (5.0–10.5): transfers ──
        tl.fromTo('[id="f02-seal-a"]', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, T.ribA + T.ribDur);
        tl.fromTo('[id="f02-coin"]', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, T.ribB + 0.7);
        tl.fromTo('[id="f02-pill-b"]', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, T.ribB + 0.85);
        tl.fromTo('[id="f02-pill-c"]', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, T.ribC + 0.4);
        // amounts float into the 流出 cell (grey, not counted yet)
        tl.to('[id="f02-cn-out"]', { opacity: 0, duration: 0.2, ease: "power1.out" }, T.ribA);
        [["f02-stack-a", T.ribA, 900 - 410, 860 - 497], ["f02-stack-b", T.ribB, 900 - 410, 1250 - 523], ["f02-stack-c", T.ribC, 120 - 410, 640 - 549]]
          .forEach(([id, at, dx, dy]) => {
            tl.fromTo('[id="' + id + '"]', { opacity: 0, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: 0.6, ease: "power2.inOut" }, at + 0.05);
          });
        tl.fromTo('[data-composition-id="02-river"] .f02-strike', { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.22, ease: "power2.out" }, 8.62);
        tl.to(['[data-composition-id="02-river"] .f02-strike', '[data-composition-id="02-river"] .f02-stack'],
          { opacity: 0, y: "+=22", duration: 0.3, ease: "power2.in" }, 8.88);
        tl.to('[id="f02-cn-out"]', { opacity: 0.35, duration: 0.25, ease: "power1.out" }, 9.15);
        // ribbons pale out, detach and condense into the transfer panel
        tl.to(['[id="f02-seal-a"]', '[id="f02-pill-b"]', '[id="f02-pill-c"]'], { opacity: 0, duration: 0.3, ease: "power1.out" }, T.fly);
        tl.fromTo('[id="f02-xfer"]', { x: 0, y: 0, scale: 1, opacity: 1 },
          { x: 0, y: 674 - 950, scale: 0.2, duration: T.flyDur, ease: "power2.inOut", transformOrigin: "540px 950px" }, T.fly);
        tl.to('[id="f02-xfer"]', { opacity: 0, duration: 0.5, ease: "power1.in" }, T.fly + T.flyDur - 0.5);
        tl.fromTo('[id="f02-panel"]', { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out", transformOrigin: "50% 50%" }, T.fly + 0.7);
        tl.fromTo('[data-composition-id="02-river"] .f02-pcell', { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.08 }, T.fly + 0.95);

        // ── Scene 4 (10.5–15.5): outflow ──
        tl.fromTo('[id="f02-lbl-home"]', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, T.trib + T.tribDur - 0.1);
        ["transport", "dining", "daily", "shopping", "leisure"].forEach((k, i) => {
          tl.fromTo('[id="f02-chip-' + k + '"]', { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" },
            T.trib + (i + 1) * T.tribStep + T.tribDur - 0.1);
        });
        tl.to('[id="f02-cl-out"]', { opacity: 1, duration: 0.3, ease: "power1.out" }, 11.2);
