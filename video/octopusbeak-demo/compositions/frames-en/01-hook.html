    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var $ = function (id) {
          return document.getElementById("01-hook-" + id);
        };
        var tl = gsap.timeline({ paused: true });
        var INK = "#0e1217";
        var TEAL = "#18a9a4";

        // Scene 1 (0.0–0.8): loop-seam field. Rosette centered at (960,540) → (1500,420), dims .30 → .22.
        tl.fromTo(
          $("rosette"),
          { x: 0, y: 0, rotation: 0, opacity: 0.3 },
          { x: 540, y: -120, rotation: 0, opacity: 0.22, duration: 0.8, ease: "power2.inOut" },
          0,
        );
        tl.fromTo($("waves"), { opacity: 0 }, { opacity: 0.14, duration: 0.7, ease: "power1.out" }, 0.1);

        // Camera: one slow settle on the content world, resolving to scale 1 exactly at the handoff.
        tl.fromTo(
          $("world"),
          { scale: 1.035, transformOrigin: "960px 540px" },
          { scale: 1, duration: 3.7, ease: "power2.out" },
          0.8,
        );

        // Scene 2 (0.8–1.8): "One purchase," — per-word reveal. Starts are held to the 繁中 cut's beats
        // (0.82 / 1.11 / 1.35) so the English line lands on the same timing; English word length would
        // otherwise push the comma past the first slip drop at 1.85.
        var SEQ = [
          { id: "w1", start: 0.82 },
          { id: "w2", start: 1.11 },
          { id: "w3", start: 1.35 },
        ];
        SEQ.forEach(function (w) {
          tl.fromTo(
            $(w.id),
            { opacity: 0, y: 70, filter: "blur(14px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
            w.start,
          );
        });

        // Micro-line rules: measured length (svg-path-draw).
        ["rule-a", "rule-b"].forEach(function (id) {
          var p = $(id);
          var len = p.getTotalLength();
          p.style.strokeDasharray = len + "";
          p.style.strokeDashoffset = len + "";
        });

        function dropSlip(key, start, rotFrom, rotTo) {
          tl.fromTo(
            $("slip-" + key),
            { y: -760, rotation: rotFrom, opacity: 0, filter: "blur(6px)" },
            { y: 0, rotation: rotTo, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
            start,
          );
          // Directional streak trailing the arrival, collapsing into the slip as it lands.
          tl.fromTo(
            $("streak-" + key),
            { opacity: 0.9, scaleY: 1, transformOrigin: "50% 100%" },
            { opacity: 0, scaleY: 0, duration: 0.32, ease: "power2.out" },
            start + 0.02,
          );
          tl.to($("rule-" + key), { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, start + 0.28);
        }

        // Scene 3 (1.8–2.8): slip one drops to (600,720), rests at −2°.
        dropSlip("a", 1.85, -9, -2);

        // Scene 4 (2.8–3.7): slip two mirrors to (1320,720), rests at 2°; both amounts flash teal once on landing.
        dropSlip("b", 2.85, 9, 2);
        tl.fromTo(
          [$("amt-a"), $("amt-b")],
          { color: INK },
          { color: TEAL, duration: 0.1, ease: "power1.out" },
          3.02,
        );
        tl.to([$("amt-a"), $("amt-b")], { color: INK, duration: 0.42, ease: "power2.out" }, 3.14);

        // Scene 5 (3.7–4.5): payoff "counted twice?" — one hard, percussive arrival.
        tl.fromTo(
          $("payoff"),
          { opacity: 0, scale: 1.38, filter: "blur(10px)", transformOrigin: "0% 70%" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" },
          3.75,
        );
        // Hold: subtle jitter on the two slips only, settling exactly at rest for the handoff.
        tl.to(
          $("slip-a"),
          { keyframes: { x: [0, 2, -1.5, 1.2, -0.6, 0], y: [0, -1.2, 1, -0.8, 0.4, 0] }, duration: 0.55, ease: "none" },
          3.9,
        );
        tl.to(
          $("slip-b"),
          { keyframes: { x: [0, -1.6, 1.8, -1, 0.5, 0], y: [0, 1, -1.3, 0.6, -0.3, 0] }, duration: 0.55, ease: "none" },
          3.9,
        );
        tl.set({}, {}, 4.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["01-hook"] = tl;
      })();
