        line-height: 120px;
        color: #0e1217;

        top: 0;

        display: block;
        margin-left: 4.64px;

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var $ = function (id) {
          return document.getElementById("02-value-" + id);
        };
        var tl = gsap.timeline({ paused: true });
        var DUR = 4;

        // ── Scene 1 (0.0–1.0): microline strike through "twice?", hard swap to "once." ──
        var strike = [$("strike-core"), $("strike-path")];
        var strikeLen = $("strike-path").getTotalLength();
        tl.fromTo(
          strike,
          { strokeDasharray: strikeLen, strokeDashoffset: strikeLen },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          0.15,
        );
        // "twice?" (with its strike) drops out of the slot…
        tl.to($("old-b"), { y: 46, opacity: 0, duration: 0.13, ease: "power2.in" }, 0.6);

        // …and "once." / later "Counted" land as discrete states. Each state's text is static in the DOM and
        // switched on by a 1 ms opacity tween ending exactly at t, so any seek (forwards or backwards) lands on
        // the right state without relying on callbacks. (A true zero-duration tween here rendered its end
        // state early on forward seeks.)
        var SWAPS = [
          { id: "new-b", t: 0.74 }, // "once."
          { id: "new-a", t: 1.82 }, // "Counted" replaces "counted"
        ];
        SWAPS.forEach(function (s) {
          tl.fromTo($(s.id), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, s.t - 0.001);
        });

        // ── Scene 2 (1.0–2.2): deep blue washes to paper behind a left→right wave band ──
        // Edge E travels −220 → 2140. Wrapper right edge = 1920 + x, so x = E − 1920; the paper
        // counter-translates so it stays pinned to the frame. The band shares the exact tween (velocity-matched).
        var WIPE_START = 1.02;
        var WIPE_DUR = 1.05;
        var WIPE_EASE = "power2.inOut";
        tl.fromTo($("wipe"), { x: -2140 }, { x: 220, duration: WIPE_DUR, ease: WIPE_EASE }, WIPE_START);
        tl.fromTo($("paper"), { x: 2140 }, { x: -220, duration: WIPE_DUR, ease: WIPE_EASE }, WIPE_START);
        tl.fromTo($("band"), { x: -440 }, { x: 1920, duration: WIPE_DUR, ease: WIPE_EASE }, WIPE_START);

        // Type recolors white → ink glyph by glyph, each the moment the wipe edge crosses it
        // (crossing time solved once at build from the wipe's own ease; "once." keeps its teal).
        var wipeEase = gsap.parseEase(WIPE_EASE);
        function edgeTime(x) {
          var target = (x + 220) / 2360;
          var lo = 0;
          var hi = 1;
          for (var k = 0; k < 40; k++) {
            var mid = (lo + hi) / 2;
            if (wipeEase(mid) < target) lo = mid;
            else hi = mid;
          }
          return WIPE_START + lo * WIPE_DUR;
        }
        // Word centers measured at 130px PingFang TC 500, 0.01em tracking, line start x=200:
        // "One" 200–452.6, "purchase" 497.2–1070.5, "," 1070.5–1107.2 (line one); "counted" 200–707 (line two).
        var CENTERS = [326.3, 783.8, 1088.8, 453.5];
        var chars = document.querySelectorAll('[data-composition-id="02-value"] .\\30 2-value-ch');
        Array.prototype.forEach.call(chars, function (ch, i) {
          var t = edgeTime(CENTERS[i]);
          tl.fromTo(ch.querySelector(".\\30 2-value-ink"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, t);
        });

        // Old line one zooms through and out; "counted" drops from its slot.
        tl.to(
          $("l1old"),
          { scale: 1.06, opacity: 0, filter: "blur(10px)", transformOrigin: "0% 60%", duration: 0.26, ease: "power2.in" },
          1.5,
        );
        tl.to($("old-a"), { y: 40, opacity: 0, duration: 0.14, ease: "power2.in" }, 1.56);
        // Line two rises to its new slot (baseline 440 → 360); "Counted" snaps in at 1.82 via SWAPS.
        tl.fromTo($("l2"), { y: 0 }, { y: -80, duration: 0.42, ease: "power3.inOut" }, 1.56);
        // "Counted " is 22.5px wider than "counted ": "once." eases right with the rise so the word space holds.
        tl.fromTo($("slot-b"), { x: 0 }, { x: 22.5, duration: 0.42, ease: "power3.inOut" }, 1.56);

        // New line one: icon + OctopusBeak + finds the duplicate. — per-word staggered reveal.
        ["appicon", "nw-brand", "nw-1", "nw-2", "nw-3"].forEach(function (id, i) {
          tl.fromTo(
            $(id),
            { opacity: 0, x: -28, y: 18, filter: "blur(8px)" },
            { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.out" },
            1.66 + i * 0.09,
          );
        });

        // ── Scene 3 (2.2–3.4): slips straighten and glide into the stacked row pair, morphing slip → row ──
        var MORPH_START = 2.2;
        var MORPH_DUR = 1.1;
        var SX = 1000 / 640;
        var SY = 120 / 200;
        // radius is pre-scale: divide per axis so the APPARENT corner lands at Frame 3's 20px
        var R_END = (20 / SX).toFixed(2) + "px " + (20 / SY).toFixed(2) + "px";
        function morph(key, rotFrom, dx, dy) {
          tl.fromTo(
            $("mover-" + key),
            { x: 0, y: 0, rotation: rotFrom },
            { x: dx, y: dy, rotation: 0, duration: MORPH_DUR, ease: "power3.out" },
            MORPH_START,
          );
          tl.fromTo(
            $("plate-" + key),
            {
              scaleX: 1,
              scaleY: 1,
              borderTopLeftRadius: "24px 24px",
              borderTopRightRadius: "24px 24px",
              borderBottomLeftRadius: "24px 24px",
              borderBottomRightRadius: "24px 24px",
              boxShadow: "0 18px 40px rgba(15,23,42,0.12), 0 34px 70px rgba(2,8,23,0.38)",
            },
            {
              scaleX: SX,
              scaleY: SY,
              borderTopLeftRadius: R_END,
              borderTopRightRadius: R_END,
              borderBottomLeftRadius: R_END,
              borderBottomRightRadius: R_END,
              boxShadow: "0 18px 40px rgba(15,23,42,0), 0 34px 70px rgba(2,8,23,0)",
              duration: MORPH_DUR,
              ease: "power3.out",
            },
            MORPH_START,
          );
          // old slip content out in the first ~35%, real row in over the last ~45% (shape-only blink between)
          tl.fromTo(
            $("slip-" + key),
            { opacity: 1 },
            { opacity: 0, duration: MORPH_DUR * 0.35, ease: "power1.in" },
            MORPH_START,
          );
          tl.fromTo(
            $("row-" + key),
            { opacity: 0 },
            { opacity: 1, duration: MORPH_DUR * 0.45, ease: "power1.out" },
            MORPH_START + MORPH_DUR * 0.55,
          );
        }
        // invoice (600,720) −2° → (1220,470); card (1320,720) 2° → (1220,610)
        morph("a", -2, 620, -250);
        morph("b", 2, -100, -110);

        // ── Scene 4 (3.4–4.0): the headline lifts and clears; rows hold at the handoff ──
        tl.to($("head"), { y: -70, opacity: 0, duration: 0.45, ease: "power2.in" }, 3.4);

        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines["02-value"] = tl;
      })();
    </script>
