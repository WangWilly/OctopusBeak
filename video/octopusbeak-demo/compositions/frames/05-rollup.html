  <script>
    (function () {
      var $ = function (n) {
        return document.getElementById("05-rollup-" + n);
      };
      var world = $("world");
      var cardLayer = $("cardlayer");
      var card = $("card");

      // ── card-world geometry (all derived, never hand-tuned) ──
      // Spending plate is a 1425×2159 page; it sits in the world at (1420,380), 400 wide.
      var SP = { x: 1420, y: 380, k: 400 / 1425 };
      // 全聯福利中心 list row in page px (measured from the 2× plate): x 297–1384, y 1708–1794.
      var ROW = { x: 297, y: 1708, w: 1087, h: 86 };
      var rowW = ROW.w * SP.k;
      var rowH = ROW.h * SP.k;
      var rowCx = SP.x + (ROW.x + ROW.w / 2) * SP.k;
      var rowCy = SP.y + (ROW.y + ROW.h / 2) * SP.k;
      // Frame-4 handoff: card 1560×640 centred at (960,560) on screen.
      var CARD = { cx: 960, cy: 560, w: 1560, h: 640 };
      var S0 = CARD.w / rowW; // camera scale at t=0 so the row reads exactly as the card

      // ── camera: world screen = S·w + (x, y) (origin 0 0) ──
      // Scale: S(t) = S0^(1 − p), p = power1.out(ramped t / 4.6) — log-scale interpolation, one
      // decelerating pull to a dead stop. Focus Fc (world point at screen centre) glides from
      // the row, to the spending page's centre (row + 本月消費 in view), then to the overview
      // layout — all as custom eases on tweens of the one world wrapper (no callbacks, seek-safe).
      // Frame 4 ends at rest, so warp time with a short velocity ramp (A = 0.15 of the shot)
      // before the power1.out deceleration; the pull-back starts from zero speed, no jolt at the cut.
      var pOut = gsap.parseEase("power1.out");
      var A = 0.15;
      var p1 = function (t) {
        var u = t < A ? (t * t) / (2 * A) : t - A / 2;
        return pOut(u / (1 - A / 2));
      };
      var smooth = function (u) {
        u = Math.min(1, Math.max(0, u));
        return u * u * (3 - 2 * u);
      };
      var F0 = { x: rowCx, y: rowCy - (CARD.cy - 540) / S0 }; // row centre lands on (960,560)
      var FW = { x: SP.x + 200, y: SP.y + 260 }; // spending window centre
      var F1 = { x: 960, y: 540 };
      var P_MID = 0.75;
      var camS = function (t) {
        return Math.pow(S0, 1 - p1(t));
      };
      var camF = function (t, k) {
        var p = p1(t);
        if (p <= P_MID) return F0[k] + (FW[k] - F0[k]) * smooth(p / P_MID);
        return FW[k] + (F1[k] - FW[k]) * smooth((p - P_MID) / (1 - P_MID));
      };
      var X0 = 960 - S0 * F0.x;
      var Y0 = 540 - S0 * F0.y;
      var easeS = function (t) {
        return (camS(t) - S0) / (1 - S0);
      };
      var easeX = function (t) {
        return (960 - camS(t) * camF(t, "x") - X0) / (0 - X0);
      };
      var easeY = function (t) {
        return (540 - camS(t) * camF(t, "y") - Y0) / (0 - Y0);
      };

      // Card layer is authored in t=0 screen px; map it into world space: w = (L − (X0,Y0)) / S0.
      cardLayer.style.transform = "translate(" + -X0 / S0 + "px," + -Y0 / S0 + "px) scale(" + 1 / S0 + ")";

      // svg-path-draw setup
      ["thread1", "thread2"].forEach(function (n) {
        var p = $(n);
        var len = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = len + "";
        p.style.strokeDashoffset = len + "";
      });

      var tl = gsap.timeline({ paused: true });

      // ── the ONE continuous decelerating pull-back: 0 → 4.6s, then locked ──
      tl.fromTo(world, { scale: S0, transformOrigin: "0 0", force3D: false }, { scale: 1, duration: 4.6, ease: easeS, force3D: false }, 0);
      tl.fromTo(world, { x: X0 }, { x: 0, duration: 4.6, ease: easeX, force3D: false }, 0);
      tl.fromTo(world, { y: Y0 }, { y: 0, duration: 4.6, ease: easeY, force3D: false }, 0);

      // ── Scene 1 (0–1.4): title strip + seal fade; card flattens into the list row ──
