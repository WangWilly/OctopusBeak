    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.0): cursor glides in and presses 合併 ──
        tl.fromTo("#m04-cursor", { x: 330, y: 300 }, { x: 0, y: 0, duration: 0.6, ease: "power3.out" }, 0);
        tl.to("#m04-cursor", { scale: 0.85, duration: 0.1, ease: "power1.in" }, 0.72);
        tl.to("#m04-btn", { scale: 0.93, backgroundColor: "#000000", duration: 0.1, ease: "power1.in" }, 0.72);
        tl.to("#m04-cursor", { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.82);
        tl.to("#m04-btn", { scale: 1, backgroundColor: "#0e1217", duration: 0.4, ease: "back.out(1.6)" }, 0.82);
        tl.fromTo(
          [".m04-ripple"],
          { scale: 0.4, opacity: 0.9 },
          { scale: 4, opacity: 0, duration: 0.65, ease: "power2.out", stagger: 0.09, immediateRender: false },
          0.74,
        );

        // ── Scene 2 (1.0–2.2): two rows fold into one ──
        tl.to(["#m04-chips", "#m04-btn", "#m04-cursor"], { y: "+=24", opacity: 0, duration: 0.35, ease: "power2.in", stagger: 0.04 }, 1.0);
        tl.fromTo("#m04-link-line", { strokeDasharray: 1, strokeDashoffset: 0 }, { strokeDashoffset: -1, duration: 0.35, ease: "power2.in" }, 1.0);
        tl.fromTo("#m04-eq", { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, 1.0);
        // rows converge on y=520 (invoice 470→520, card 610→520)
        tl.to("#m04-row-inv", { y: 50, duration: 0.5, ease: "power3.inOut" }, 1.05);
        tl.to("#m04-row-card", { y: -90, duration: 0.5, ease: "power3.inOut" }, 1.05);
        // scale-swap: outgoing pair shrinks + fades, merged row pops in on the same center
        tl.to([".m04-row"], { scale: 0.75, opacity: 0, duration: 0.35, ease: "power2.in" }, 1.5);
        tl.fromTo("#m04-merged", { scale: 0.75, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 1.72);
        tl.to("#m04-merchant", { opacity: 0.22, duration: 0.4, ease: "power2.out" }, 1.9);

        // ── Scene 3 (2.2–3.4): THE HIT — rosette seal stamps down ──
        tl.fromTo("#m04-seal", { scale: 2, rotation: -25, opacity: 0 }, { scale: 1, rotation: 0, opacity: 0.9, duration: 0.5, ease: "expo.out" }, 2.25);
        tl.fromTo("#m04-seal-text", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 2.5);
        const HIT = 2.42;
        tl.to("#m04-world", { x: 7, y: 3, duration: 0.05, ease: "power1.out" }, HIT);
        tl.to("#m04-world", { x: -5, y: -2, duration: 0.06, ease: "power1.inOut" }, HIT + 0.05);
        tl.to("#m04-world", { x: 3, y: 1, duration: 0.06, ease: "power1.inOut" }, HIT + 0.11);
        tl.to("#m04-world", { x: -1.5, y: 0, duration: 0.06, ease: "power1.inOut" }, HIT + 0.17);
        tl.to("#m04-world", { x: 0, y: 0, duration: 0.08, ease: "power1.out" }, HIT + 0.23);
        tl.fromTo(
          [".m04-ink"],
          { scale: 0.9, opacity: 0.8 },
          { scale: 1.9, opacity: 0, duration: 0.8, ease: "power2.out", stagger: 0.1, immediateRender: false },
          HIT,
        );

        // ── Scene 4 (3.4–5.0): count types in, badge pops, hold ──
        const SEQ = [
          { t: 0, text: "" },
          { t: 3.45, text: "本" },
          { t: 3.56, text: "本月" },
          { t: 3.68, text: "本月計" },
          { t: 3.8, text: "本月計為" },
          { t: 4.02, text: "本月計為 1" },
          { t: 4.14, text: "本月計為 1 筆" },
        ];
        const textEl = document.getElementById("m04-count-text");
        const caretEl = document.getElementById("m04-caret");
        const textAt = (time) => {
          for (let i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i].text;
          return "";
        };
        const drv = { t: 0 };
        tl.to(drv, {
          t: 5,
          duration: 5,
          ease: "none",
          onUpdate: () => {
            textEl.textContent = textAt(drv.t);
