    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="06-brand"]');
        const $ = (id) => root.querySelector('[id="06-brand-' + id + '"]');
        const tl = gsap.timeline({ paused: true });

        const rosette = $("rosette");
        const rings = root.querySelectorAll('[id="06-brand-rosette"] g[data-ring]');
        const waves = $("waves");
        const icon = $("icon");
        const wordmark = $("wordmark");
        const chunks = wordmark.querySelectorAll("span");
        const rule = $("rule");
        const ruleInner = $("rule-inner");
        const sub = $("sub");
        const sun = $("sun");

        // Loop-seam geometry: the rosette rests at (960,540) when x/y = 0; the lockup centre is (380,420).
        const LOCK_X = 380 - 960;
        const LOCK_Y = 420 - 540;

        // Scene 1 (0.0–1.0): field + waves; the rosette draws on ring by ring, centre outward.
        tl.fromTo(waves, { opacity: 0 }, { opacity: 0.14, duration: 0.8, ease: "power1.out" }, 0);
        tl.set(rosette, { x: LOCK_X, y: LOCK_Y, rotation: 0, opacity: 0.42 }, 0);
        const RING_DUR = 0.42;
        rings.forEach((ring, i) => {
          const at = 0.08 + i * RING_DUR * 0.4;
          tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, at);
          tl.fromTo(
            ring,
            { strokeDashoffset: 1 },
            { strokeDashoffset: 0, duration: RING_DUR, ease: "power2.out" },
            at,
          );
        });

        // Scene 2 (1.0–2.0): icon blooms at the rosette centre; wordmark builds chunk by chunk; Sun rises.
        tl.fromTo(
          icon,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          1.0,
        );

        // Content-driven chunk timing, pre-computed once from each chunk's length.
        const BASE_DURATION = 0.12;
        const SEC_PER_CHAR = 0.04;
        let cumulative = 1.15;
        const SEQ = Array.from(chunks).map((el) => {
          const start = cumulative;
          cumulative += BASE_DURATION + el.textContent.length * SEC_PER_CHAR;
          return { el, start };
        });
        SEQ.forEach(({ el, start }) => {
          tl.fromTo(
            el,
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
            start,
          );
        });

        tl.fromTo(
          sun,
          { y: 140, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" },
          1.2,
        );

        // Scene 3 (2.0–3.4): microline rule wipes on left to right, subline sets on it; rosette turns a few degrees.
        tl.fromTo(rule, { xPercent: -100 }, { xPercent: 0, duration: 0.5, ease: "power2.out" }, 2.0);
        tl.fromTo(ruleInner, { xPercent: 100 }, { xPercent: 0, duration: 0.5, ease: "power2.out" }, 2.0);
        tl.fromTo(
          sub,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          2.3,
        );
        tl.fromTo(
          rosette,
          { rotation: 0 },
          { rotation: 5, duration: 2.3, ease: "sine.inOut", immediateRender: false },
          1.1,
        );

        // Scene 4 (3.4–4.0): loop exit. Everything but the field fades; the rosette returns to Frame 1's t=0 state.
        tl.fromTo(
          [icon, wordmark, rule, sub, sun],
          { opacity: 1 },
          { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false },
          3.4,
        );
        tl.fromTo(
          waves,
          { opacity: 0.14 },
          { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false },
          3.4,
        );
        tl.fromTo(
          rosette,
          { x: LOCK_X, y: LOCK_Y, rotation: 5, opacity: 0.42 },
          {
            x: 0,
            y: 0,
            rotation: 0,
            opacity: 0.3,
            duration: 0.52,
            ease: "power2.inOut",
            immediateRender: false,
          },
          3.4,
        );

        window.__timelines["06-brand"] = tl;
      })();
    </script>
