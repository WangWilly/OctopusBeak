    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var $ = function (id) {
          return document.getElementById("01-hook-" + id);
        };
        var tl = gsap.timeline({ paused: true });
        var FRAME_START = 0; // film time of this frame (F1)
        var DUR = 4;

        // Ground: rosette turns 0.6°/s on film time — angle 0 at film start, 2.4° at 4.0s.
        tl.fromTo(
          $("rosette"),
          { rotation: 0.6 * FRAME_START, transformOrigin: "50% 50%" },
          { rotation: 0.6 * (FRAME_START + DUR), duration: DUR, ease: "none" },
          0,
        );

        // Scene 2 (0.4–1.4): 「12 家網銀、」 waterfall-entry — binary opacity, whip up from below, overlapping.
        var F = 1 / 60;
        var WORDS = [
          { id: "w1", y: 80, d: 0.19 }, // anchor
          { id: "w2", y: 48, d: 0.15 },
          { id: "w3", y: 48, d: 0.15 },
          { id: "w4", y: 36, d: 0.11 }, // punctuation snaps
        ];
        var wt = 0.45;
        WORDS.forEach(function (w, i) {
          var el = $(w.id);
          tl.set(el, { opacity: 0, y: w.y }, 0);
          tl.set(el, { opacity: 1 }, wt);
          tl.to(el, { y: 0, duration: w.d, ease: "power4.out" }, wt);
          wt += w.d - (i === 0 ? -2 * F : F);
        });

        // Scene 3 (1.0–3.0): twelve tiles drop onto the pile, gaps tightening 0.26s → 0.10s.
        var ROT = [-6, 4, -3, 7, -5, 2, 5, -7, 3, -4, 6, -2];
        var starts = [];
        var t = 1.0;
        for (var i = 0; i < 12; i++) {
          starts.push(t);
          t += 0.26 - (0.16 * i) / 10;
        }
        starts.forEach(function (s, i) {
          var tile = $("tile-" + i);
          var r = ROT[i];
          // fast arrival from 120px above
          tl.fromTo(tile, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, s);
          tl.fromTo(tile, { y: -120 }, { y: 0, duration: 0.3, ease: "expo.out" }, s);
          // spring-pop settle (smooth register, no overshoot) into its resting rotation
          tl.fromTo(
            tile,
            { scale: 0.86, rotation: r * 2.2 },
            { scale: 1, rotation: r, duration: 0.42, ease: "power3.out" },
            s,
          );
        });

        // Counter 01 → 12 in lockstep with the tiles (discrete-text-sequence).
        var counter = $("counter");
        var SEQUENCE = [{ t: 0, text: "01" }];
        starts.forEach(function (s, i) {
          if (i > 0) SEQUENCE.push({ t: s + 0.08, text: (i + 1 < 10 ? "0" : "") + (i + 1) });
        });
        // Each state holds from its t until the next entry's t: one stacked numeral per state, swapped by instant sets.
        var nums = counter.querySelectorAll(".\\30 1-hook-num");
        SEQUENCE.forEach(function (st, k) {
          if (k === 0) return;
          tl.set(nums[k - 1], { opacity: 0 }, st.t);
          tl.set(nums[k], { opacity: 1 }, st.t);
        });
        // counter takes its seat at the line's end as the line settles, then fades out at 3.8s
        tl.fromTo(counter, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.95);
        tl.to(counter, { opacity: 0, duration: 0.2, ease: "power1.out" }, 3.8);

        // Scene 4 (2.6–3.4): 「12 logins a month?」 — one hard scale-slam.
        tl.fromTo(
          $("payoff"),
          { opacity: 0, scale: 1.45, filter: "blur(14px)", transformOrigin: "0% 70%" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power4.out" },
          3.02,
        );

        // Scene 5 (3.4–4.0): hold — only the rosette turns.
        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines["01-hook"] = tl;
      })();
    </script>
