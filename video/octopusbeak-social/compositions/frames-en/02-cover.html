  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "02-cover";
      var host = document.querySelector('[data-composition-id="' + ID + '"]');
      var root = host.matches("#root") ? host : host.querySelector("#root") || host;
      function $(id) {
        return root.querySelector('[id="' + ID + "-" + id + '"]');
      }

      // ---- tiles: built deterministically from the 01-hook pile spec ----
      var LOGOS = [
        "fubon", "esun", "yuanta-bank",
        "yuanta-securities", "cathay", "hncb",
        "ctbc", "post", "sinopac",
        "linebank", "einvoice", "maicoin"
      ];
      var ROT = [-6, 4, -3, 7, -5, 2, 5, -7, 3, -4, 6, -2];
      var COLS = [260, 540, 820];
      var ROWS = [820, 1040, 1260, 1480];
      var CX = 540, CY = 760; // icon spot on the cover
      var GHOST_LAG = [0.035, 0.07, 0.105];
      var GHOST_OP = [0.42, 0.26, 0.12];

      function makeTile(logo, extraClass) {
        var pivot = document.createElement("div");
        pivot.className = "c02-pivot" + (extraClass ? " " + extraClass : "");
        var tile = document.createElement("div");
        tile.className = "c02-tile";
        var img = document.createElement("img");
        img.src = "assets/logos/" + logo + ".webp";
        img.alt = "";
        tile.appendChild(img);
        pivot.appendChild(tile);
        return { pivot: pivot, tile: tile };
      }

      var tiles = [];
      var ghosts = [];
      var tilesLayer = $("tiles");
      var ghostsLayer = $("ghosts");
      for (var i = 0; i < 12; i++) {
        var t = makeTile(LOGOS[i]);
        tilesLayer.appendChild(t.pivot);
        tiles.push(t);
        var g = [];
        for (var k = 0; k < 3; k++) {
          var gh = makeTile(LOGOS[i], "c02-ghost");
          ghostsLayer.appendChild(gh.pivot);
          g.push(gh);
        }
        ghosts.push(g);
      }

      var tl = gsap.timeline({ paused: true });
      var DUR = 4.5;
      var FRAME_START = 4.0;

      // ---- ground: rosette angle continuous across the film (0.6 deg/s) ----
      tl.fromTo(
        $("ground-rosette"),
        { rotation: 0.6 * FRAME_START },
        { rotation: 0.6 * (FRAME_START + DUR), duration: DUR, ease: "none" },
        0
      );

      // ---- Scene 1 (0.0–0.6): headline lifts out, cover rises from below behind the pile ----
      tl.fromTo([$("head1"), $("head2")], { y: 0, opacity: 1 }, { y: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, 0);
      // starts fully below the canvas so the cut from 01-hook shows no cover yet (spec: +900)
      tl.fromTo($("book"), { y: 1640 }, { y: 0, duration: 0.6, ease: "expo.out" }, 0);

      // ---- Scene 2 (0.5–1.6): tiles spiral into the icon spot, 3-ghost echo trail ----
      var SPIN = 150;
      var TRAVEL = 0.55;
      function travel(p, tile, i, t0, op) {
        var x0 = COLS[i % 3] - CX;
        var y0 = ROWS[Math.floor(i / 3)] - CY;
        tl.fromTo(p, { rotation: 0 }, { rotation: SPIN, duration: TRAVEL, ease: "power3.in" }, t0);
        tl.fromTo(
          tile,
          { x: x0, y: y0, rotation: ROT[i], scale: 1 },
          { x: 0, y: 0, rotation: -SPIN, scale: 0.2, duration: TRAVEL, ease: "power3.in" },
          t0
        );
        if (op !== undefined) {
          tl.fromTo(p, { opacity: 0 }, { opacity: op, duration: 0.001, ease: "none", immediateRender: true }, t0);
        }
        tl.set(p, { opacity: 0 }, t0 + TRAVEL);
      }
      for (var j = 0; j < 12; j++) {
        var start = 0.5 + j * 0.05;
        travel(tiles[j].pivot, tiles[j].tile, j, start);
        for (var m = 0; m < 3; m++) {
          travel(ghosts[j][m].pivot, ghosts[j][m].tile, j, start + GHOST_LAG[m], GHOST_OP[m]);
        }
      }
      // icon pulse as the last tile lands (1.6s)
      var landed = 0.5 + 11 * 0.05 + TRAVEL;
      tl.fromTo($("icon"), { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power3.out" }, landed);
      tl.to($("icon"), { scale: 1, duration: 0.28, ease: "power3.out" }, landed + 0.12);

      // ---- Scene 3 (1.4–2.6): cover type carries the line — waterfall arrivals with stepped clip ----
      var F = 1 / 60;
      function arrive(el, at, travelY, dur) {
        tl.set(el, { opacity: 1, y: travelY }, at);
        tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, at);
        tl.fromTo(
          el,
          { clipPath: "inset(0% 0% 100% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: dur + 0.06, ease: "steps(6)", immediateRender: false },
          at
        );
      }
      var hand = $("hand"), sub = $("sub"), tag = $("tag");
      gsap.set([hand, sub, tag], { opacity: 0 });
      var titleText = $("titletext");
      gsap.set(titleText, { opacity: 0 });

      var t1 = 1.4;
