      // ── Scene 1 (0.0–0.6): badge pops, title prints ──
      tl.fromTo($("badge"), { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.05);
      tl.fromTo($("title"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.28, ease: "steps(8)" }, 0.25);

      // ── Scene 2 (0.6–1.0): overview clipping lands, −1° tilt ──
      tl.fromTo(
        $("clip"),
        { y: -70, scale: 1.08, rotation: -4, opacity: 0 },
        { y: 0, scale: 1, rotation: -1, opacity: 1, duration: 0.4, ease: "expo.out" },
        0.6
      );

      // ── Scene 3 (1.0–2.6): count-up + chart line draw ──
      var num = $("num");
      var TARGET = 2148216;
      var fmt = function (v) {
        return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      };
      // property tween + modifier (no callbacks), so it renders correctly under any seek
      tl.fromTo(
        num,
        { innerText: 0 },
        {
          innerText: TARGET,
          duration: 1.6,
          ease: "power3.out",
          modifiers: {
            innerText: function (v) {
              return fmt(Math.round(parseFloat(v)));
            },
          },
        },
        1.0
      );
      tl.fromTo($("counter"), { scale: 0.55 }, { scale: 1, duration: 1.6, ease: "power3.out" }, 1.0);

      var curve = $("curve");
      var len = curve.getTotalLength() * 1.02;
      curve.style.strokeDasharray = len + " " + len;
      tl.fromTo($("chart"), { opacity: 0 }, { opacity: 0.5, duration: 0.3, ease: "power1.out" }, 1.0);
      tl.fromTo(curve, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.6, ease: "power3.out" }, 1.0);
      tl.fromTo($("dot"), { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "expo.out" }, 2.6);

      tl.fromTo($("flash"), { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.out" }, 2.6);
      tl.to($("flash"), { opacity: 0, duration: 0.45, ease: "power2.out" }, 2.67);

      // camera: gentle push toward the number, then ease back for the fan
      tl.fromTo($("world"), { scale: 1 }, { scale: 1.035, duration: 1.6, ease: "power3.out" }, 1.0);
      tl.to($("world"), { scale: 1, duration: 1.1, ease: "power2.inOut" }, 2.75);

      // ── Scene 4 (2.7–3.9): three tab clippings fan out from below ──
      var tabs = [
        { id: "tab-a", cy: 1160, rot: -5 },
        { id: "tab-b", cy: 1180, rot: 0 },
        { id: "tab-c", cy: 1160, rot: 5 },
      ];
      tabs.forEach(function (t, i) {
        var at = 2.7 + i * 0.12;
        tl.fromTo(
          $(t.id),
          { y: 1600 - t.cy, rotation: t.rot * 2.4, opacity: 0 },
          { y: 0, rotation: t.rot, opacity: 1, duration: 0.8, ease: "power3.out" },
          at
        );
      });

      // ── Scene 5 (4.0–4.3): ③ stamp slams + 3px book shake ──
      tl.fromTo(
        $("stamp"),
        { scale: 1.6, rotation: -12, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, rotation: -12, opacity: 0.92, duration: 0.18, ease: "expo.out" },
        4.0
      );
      var book = $("book");
      tl.fromTo(book, { x: 0, y: 0 }, { x: 3, y: 2, duration: 0.04, ease: "none" }, 4.16);
      tl.to(book, { x: -2.2, y: -1.4, duration: 0.05, ease: "none" }, 4.2);
      tl.to(book, { x: 1.2, y: 0.8, duration: 0.05, ease: "none" }, 4.25);
      tl.to(book, { x: -0.5, y: -0.3, duration: 0.05, ease: "none" }, 4.3);
      tl.to(book, { x: 0, y: 0, duration: 0.06, ease: "none" }, 4.35);

      // ── Scene 6 (4.3–4.9): hold ──

      // ── Scene 7 (4.9–6.0): cover swings shut from the left ──
      tl.set($("cover"), { opacity: 1 }, 4.9);
      tl.fromTo($("cover"), { rotationY: -180 }, { rotationY: 0, duration: 0.7, ease: "power2.inOut" }, 4.9);
      // passes −90° at the midpoint (4.9 + 0.35): front fades in, back drops away
      tl.fromTo($("cover-front"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 5.2);
      tl.fromTo($("cover-back"), { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none" }, 5.25);
      // soft 4px settle shake
      tl.fromTo(book, { y: 0 }, { y: 4, duration: 0.06, ease: "power1.out" }, 5.6);
      tl.to(book, { y: -2, duration: 0.08, ease: "power1.inOut" }, 5.66);
      tl.to(book, { y: 1, duration: 0.08, ease: "power1.inOut" }, 5.74);
      tl.to(book, { y: 0, duration: 0.1, ease: "power1.out" }, 5.82);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-overview"] = tl;
    })();
  </script>
