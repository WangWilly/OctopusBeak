      <div data-hf-id="hf-mwsi" id="04-sync-ripple"></div>
      <div data-hf-id="hf-gqcq" id="04-sync-cursor">
        <svg data-hf-id="hf-puyu" viewBox="0 0 44 60" aria-hidden="true">
          <path data-hf-id="hf-4dbs" d="M6 4 L6 48 L17 37 L25 55 L32 52 L24 34 L39 34 Z" fill="#0e1217" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="04-sync"]');
        var q = function (sel) { return root.querySelector(sel); };
        var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

        var FRAME_START = 13.5;
        var DUR = 6;
        var ROT_RATE = 0.6;
        var PRINT_DUR = 0.28;
        var PRINT_EASE = "steps(8)";
        var CLIP_HIDDEN = "inset(0% 100% 0% 0%)";
        var CLIP_SHOWN = "inset(0% 0% 0% 0%)";

        var tl = gsap.timeline({ paused: true });

        function print(el, at) {
          tl.fromTo(el, { clipPath: CLIP_HIDDEN }, { clipPath: CLIP_SHOWN, duration: PRINT_DUR, ease: PRINT_EASE }, at);
        }

        // ground: rosette angle continuous across the film
        tl.fromTo(
          q('[id="04-sync-rosette"]'),
          { rotation: ROT_RATE * FRAME_START },
          { rotation: ROT_RATE * (FRAME_START + DUR), duration: DUR, ease: "none" },
          0
        );

        // Scene 1 (0.0–0.6): badge pops, title prints
        tl.fromTo(q('[id="04-sync-badge"]'), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.05);
        print(q('[id="04-sync-title"]'), 0.25);

        // Scene 2 (0.6–1.4): clipping lands, cursor glides and clicks 同步全部
        tl.fromTo(
          q('[id="04-sync-clip"]'),
          { y: -60, scale: 1.08, rotation: 4, opacity: 0 },
          { y: 0, scale: 1, rotation: 1.5, opacity: 1, duration: 0.42, ease: "power3.out" },
          0.6
        );
        var cursor = q('[id="04-sync-cursor"]');
        var TIP_X = 783 - 6;
        var TIP_Y = 622 - 4;
        tl.fromTo(cursor, { x: 980, y: 940, opacity: 0 }, { x: 980, y: 940, opacity: 1, duration: 0.12, ease: "power1.out" }, 0.62);
        tl.to(cursor, { x: TIP_X, y: TIP_Y, duration: 0.45, ease: "power3.out" }, 0.7);
        var CLICK_AT = 1.2;
        tl.to(cursor, { scale: 0.85, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, CLICK_AT);
        tl.to(q('[id="04-sync-crop-r"]'), { scale: 0.95, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, CLICK_AT);
        tl.fromTo(
          q('[id="04-sync-ripple"]'),
          { scale: 0, opacity: 1 },
          { scale: 4, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false },
          CLICK_AT + 0.02
        );
        tl.set(q('[id="04-sync-ripple"]'), { scale: 0, opacity: 0 }, 0);
        // cursor leaves the page once the machine takes over
        tl.to(cursor, { x: 1180, y: 1180, duration: 0.6, ease: "power2.in" }, 1.55);

        // Scene 3 (1.5–4.3): rows print, bars fill, Synced + ✓
        var ROW_START = 1.5;
        var ROW_STAGGER = 0.65;
        var FILL_DUR = 0.45;
        qa(".\\30 4-sync-row").forEach(function (row, i) {
          var at = ROW_START + i * ROW_STAGGER;
          var bar = row.querySelector(".\\30 4-sync-bar");
          var fill = row.querySelector(".\\30 4-sync-fill");
          var done = row.querySelector(".\\30 4-sync-done");
          var check = done.querySelector("path");
          var len = check.getTotalLength();
          check.style.strokeDasharray = len;

          print(row, at);
          tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: FILL_DUR, ease: "power2.out" }, at + PRINT_DUR);
          var doneAt = at + PRINT_DUR + FILL_DUR + 0.02;
          tl.fromTo(bar, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 61.5% 0% 0%)", duration: 0.12, ease: "steps(4)" }, doneAt);
          tl.fromTo(done, { clipPath: CLIP_HIDDEN }, { clipPath: CLIP_SHOWN, duration: 0.2, ease: "steps(6)" }, doneAt + 0.04);
          tl.fromTo(check, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, doneAt + 0.04);
        });

        // Scene 4 (2.6–3.4): sub-line prints
        print(q('[id="04-sync-sub"]'), 2.6);

        // Scene 5 (3.4–4.3): chip springs in from its left edge
        tl.fromTo(
          q('[id="04-sync-chip"]'),
          { scale: 0, opacity: 0, y: 16 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          3.4
        );

        // Scene 6 (4.5–4.8): stamp slams + book shake
        var STAMP_AT = 4.5;
        tl.fromTo(
          q('[id="04-sync-stamp"]'),
          { scale: 1.6, opacity: 0 },
          { scale: 1, opacity: 0.92, duration: 0.18, ease: "expo.out" },
          STAMP_AT
        );
        var book = q('[id="04-sync-book"]');
        var shake = [3, -2.4, 1.6, -0.8, 0];
        shake.forEach(function (x, i) {
          tl.to(book, { x: x, y: i % 2 ? -x * 0.5 : x * 0.5, duration: 0.05, ease: "none" }, STAMP_AT + 0.18 + i * 0.05);
        });

        // Scene 7 (4.8–5.4): hold

        // Scene 8 (5.4–6.0): the filled page turns over on the spine
        var TURN_AT = 5.4;
        var TURN_DUR = 0.55;
        var top = q('[id="04-sync-top"]');
        tl.fromTo(top, { rotationY: 0 }, { rotationY: -180, duration: TURN_DUR, ease: "power2.inOut" }, TURN_AT);
        tl.fromTo(top, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none", immediateRender: false }, TURN_AT + TURN_DUR * 0.45);

        window.__timelines = window.__timelines || {};
        window.__timelines["04-sync"] = tl;
      })();
    </script>
