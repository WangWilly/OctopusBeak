    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="06-close"]');
        const $ = (id) => root.querySelector('[id="06-close-' + id + '"]');
        const tl = gsap.timeline({ paused: true });

        const DUR = 4.5;
        const FRAME_START = 25.5;
        const ROSETTE_DEG_PER_S = 0.6;

        const rosette = $("rosette");
        const cover = $("cover");
        const tagline = $("cover-tagline");
        const sun = $("sun");
        const glow = $("glow");
        const lock = $("lock");
        const pill = $("pill");
        const url = $("url");

        // Ground: rosette angle is film-continuous, 0.6°/s from the film's t=0.
        tl.fromTo(
          rosette,
          { rotation: ROSETTE_DEG_PER_S * FRAME_START },
          { rotation: ROSETTE_DEG_PER_S * (FRAME_START + DUR), duration: DUR, ease: "none" },
          0,
        );

        // Scene 1 (0.0–0.8): the closed cover shrinks to 0.42 and rises so its centre lands at (540,560).
        // nudge-curve: power3.in ramp (10%) → linear burst (65%) → power4.out tail (25%); tail ≥ 3× ramp.
        const DY = 560 - 920;
        const S0 = 1;
        const S1 = 0.42;
        const at = (f) => S0 + (S1 - S0) * f;
        tl.fromTo(
          cover,
          { y: 0, scale: S0 },
          { y: DY * 0.1, scale: at(0.1), duration: 0.16, ease: "power3.in", immediateRender: true },
          0,
        );
        tl.to(cover, { y: DY * 0.75, scale: at(0.75), duration: 0.14, ease: "none" }, 0.16);
        tl.to(cover, { y: DY, scale: S1, duration: 0.5, ease: "power4.out" }, 0.3);
        tl.fromTo(tagline, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, 0.05);

        // Scene 2 (0.5–1.6): Sun rises from below into the bottom-right; a mint bloom lands with his settle.
        tl.fromTo(sun, { y: 560 }, { y: 0, duration: 1.1, ease: "power3.out" }, 0.5);
        tl.fromTo(glow, { opacity: 0, scale: 0.85 }, { opacity: 0.3, scale: 1, duration: 0.9, ease: "power2.out" }, 0.7);

        // Scene 3 (1.0–2.0): waterfall-entry — binary arrival, whip up from below, overlapping cascade.
        const F = 1 / 60;
        const cascade = [
          { el: lock, y: 48, d: 0.12 },
          { el: $("f1"), y: 80, d: 0.19 },
          { el: $("f2"), y: 50, d: 0.16 },
          { el: $("f3"), y: 70, d: 0.17 },
          { el: $("f4"), y: 78, d: 0.16 },
        ];
        const gaps = [2 * F, -F, 4 * F, -F];
        let t = 1.0;
        cascade.forEach(({ el, y, d }, i) => {
          tl.set(el, { opacity: 1, y }, t);
          tl.to(el, { y: 0, duration: d, ease: "power4.out" }, t);
          if (i < gaps.length) t += d + gaps[i];
        });

        // Scene 4 (2.0–2.8): download pill rises in; URL wipes on left→right beneath it.
        tl.fromTo(pill, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.0);
        tl.fromTo(
          url,
          { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.out" },
          2.3,
        );

        // Scene 5 (2.8–4.1): hold — only the rosette keeps turning.

        // Scene 6 (4.1–4.5): loop seam — everything but the ground fades out.
        tl.fromTo(
          $("world"),
          { opacity: 1 },
          { opacity: 0, duration: 0.4, ease: "power1.in", immediateRender: false },
          4.1,
        );

        window.__timelines["06-close"] = tl;
      })();
