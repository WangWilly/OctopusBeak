      const q = (s) => document.querySelector('[data-composition-id="' + ID + '"] ' + s);
      const tl = gsap.timeline({ paused: true });

      // One beat array drives every phrase, tile and label.
      const BEATS = [0.4, 1.9, 3.4];

      // Ground: the rosette turns 0.6 deg per second of film time.
      tl.fromTo(q("#f01-hook-rosette-layer"),
        { rotation: 0.6 * FILM_START, transformOrigin: "50% 50%" },
        { rotation: 0.6 * (FILM_START + DUR), duration: DUR, ease: "none" }, 0);

      // Beat 1: scale + blur slam.
      tl.fromTo(q("#f01-hook-l1"),
        { scale: 1.6, filter: "blur(18px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "expo.out" }, BEATS[0]);

      // Beat 2: side snap.
      tl.fromTo(q("#f01-hook-l2"),
        { x: -360, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, BEATS[1]);

      // Beat 3: heaviest hit, rise + rotate.
      tl.fromTo(q("#f01-hook-l3"),
        { y: 120, rotation: 7, scale: 1.12, opacity: 0 },
        { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.55, ease: "circ.out" }, BEATS[2]);
      tl.fromTo(q("#f01-hook-world"),
        { scale: 1.022 },
        { scale: 1, duration: 0.6, ease: "power3.out" }, BEATS[2] + 0.08);
      // 「又」 flashes teal once, then returns to the headline gradient.
      tl.fromTo(q("#f01-hook-you"),
        { color: "rgba(95, 212, 201, 0)" },
        { color: "rgba(95, 212, 201, 1)", duration: 0.12, ease: "power3.out" }, BEATS[2] + 0.3);
      tl.to(q("#f01-hook-you"),
        { color: "rgba(95, 212, 201, 0)", duration: 0.5, ease: "power3.out" }, BEATS[2] + 0.62);

      // Tiles drop into place on each beat; labels print under them.
      const tiles = ["#f01-hook-t1", "#f01-hook-t2", "#f01-hook-t3"];
      const labels = ["#f01-hook-b1", "#f01-hook-b2", "#f01-hook-b3"];
      tiles.forEach(function (sel, i) {
        tl.fromTo(q(sel),
          { y: -420, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, BEATS[i] + 0.06);
        tl.fromTo(q(labels[i]),
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS[i] + 0.36);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
