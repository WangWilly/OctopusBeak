      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "PingFang TC", sans-serif;
        color: #0e1217;
      }
      #root * { box-sizing: border-box; }

      /* ── layer 0: paper ground ── */
      [id="f04-ground"] {
        position: absolute; inset: 0; overflow: hidden;
        background:
          radial-gradient(ellipse 85% 55% at 100% 100%, #edf4f1 0%, rgba(237, 244, 241, 0.6) 45%, rgba(237, 244, 241, 0) 80%),
          #f9fafc;
      }
      [id="f04-ground-waves"] { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [id="f04-ground-rosette"] {
        position: absolute; left: -10px; top: 410px; width: 1100px; height: 1100px;
        color: #2c6485; opacity: 0.06;
        transform-origin: 50% 50%;
      }
      [id="f04-ground-rosette"] svg { width: 1100px; height: 1100px; display: block; }

      /* ── layer 1: the ledger world ── */
      [id="f04-stage"] { position: absolute; inset: 0; }
      .f04-world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

      /* title, left x=110, baseline y=400 */
      .f04-title {
        position: absolute; left: 110px;
        font-weight: 700; color: #0e1217; white-space: nowrap;
      }
      [id="f04-title-old"] { top: 290px; font-size: 104px; line-height: 145px; } /* baseline 110 below top */
      [id="f04-title-new"] { top: 298px; font-size: 96px; line-height: 135px; }  /* baseline 102 below top */
      .f04-teal { color: #18a9a4; }
      .f04-caret {
        display: inline-block; width: 7px; height: 0.82em; margin-left: 6px;
        background: #18a9a4; vertical-align: -0.08em; opacity: 0;
      }

      /* the OctopusBeak icon: 120px, radius 28, centre (900,360), −6° */
      [id="f04-icon"] {
        position: absolute; left: 840px; top: 300px; width: 120px; height: 120px;
        border-radius: 28px; overflow: hidden;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
        transform: rotate(-6deg);
      }
      [id="f04-icon"] img { width: 120px; height: 120px; display: block; }

      /* rows: centres y = 560 … 1110, 96px tall */
      .f04-row { position: absolute; left: 0; width: 1080px; height: 96px; }
      .f04-tile {
        position: absolute; left: 110px; top: 0; width: 96px; height: 96px;
        border-radius: 24px; background: #ffffff;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
      }
      .f04-tile img { position: absolute; left: 12px; top: 12px; width: 72px; height: 72px; object-fit: contain; display: block; }
      .f04-label {
        position: absolute; left: 230px; top: 0; height: 96px;
        font-size: 50px; font-weight: 600; line-height: 96px; white-space: nowrap; color: #0e1217;
      }
      .f04-amount {
        position: absolute; right: 110px; top: 0; height: 96px;
        font-family: "SF Mono", ui-monospace, Menlo, monospace; font-weight: 700;
        font-size: 60px; line-height: 96px; white-space: nowrap;
        font-variant-numeric: tabular-nums; color: #0e1217;
      }
      .f04-amount.f04-neg { color: #8a3b2e; }
      [id="f04-plus"] {
        position: absolute; right: 980px; top: 0; height: 96px; /* right edge x=100, just left of the 外幣 tile */
        font-size: 60px; font-weight: 600; line-height: 96px; color: #5e646a;
        transform-origin: 50% 50%;
      }

      /* rule line y=1185, x 110 → 970, 6px ink */
      [id="f04-rule"] { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

      /* total row */
      [id="f04-total-label"] {
        position: absolute; left: 110px; top: 1235px; /* baseline 1290 */
        font-size: 52px; font-weight: 700; line-height: 73px; white-space: nowrap; color: #0e1217;
      }
      [id="f04-hl"] {
        position: absolute; left: 288px; top: 1226px; width: 706px; height: 96px;

      }
      [id="f04-total"] {
        position: absolute; right: 110px; top: 1222px; /* baseline 1300 */

        font-variant-numeric: tabular-nums; color: #0e1217;
      }
      [id="f04-total-num"] {
        display: inline-block; width: 9ch; text-align: right;
        transform-origin: 100% 70%;
      }

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const DUR = 5;
        const FRAME_START = 17;
        const INK = "#0e1217";
        const TEAL = "#18a9a4";
        const tl = gsap.timeline({ paused: true });

        // ── ground: rosette angle continuous across the film (0.6°/s) ──
        tl.fromTo('[id="f04-ground-rosette"]',
          { rotation: 0.6 * FRAME_START },
          { rotation: 0.6 * (FRAME_START + DUR), duration: DUR, ease: "none" }, 0);

        // ── Scene 1 (0.0–0.6): rule line draws left→right; the 「+」 pulses once ──
        const rule = document.querySelector('[id="f04-rule-path"]');
        const RULE_LEN = 860;
        rule.style.strokeDasharray = RULE_LEN + " " + RULE_LEN;
        tl.fromTo(rule, { strokeDashoffset: RULE_LEN },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.05);
        tl.fromTo('[id="f04-plus"]', { scale: 1, color: "#5e646a" },
          { scale: 1.35, color: TEAL, duration: 0.16, ease: "power2.out" }, 0.12);
        tl.to('[id="f04-plus"]', { scale: 1, color: "#5e646a", duration: 0.34, ease: "power3.out" }, 0.28);

        // ── Scene 2 (0.5–2.4): 淨資產 prints; total counts up 0 → 2,148,216 ──
        tl.fromTo('[id="f04-total-label"]',
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.24, ease: "steps(3)" }, 0.5);
        tl.fromTo('[id="f04-total-cur"]', { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.62);

        const numEl = document.querySelector('[id="f04-total-num"]');
        const COUNT_AT = 0.62;
        const COUNT_DUR = 1.68;
        // setter-driven proxy: GSAP assigns the property on every render, so the text
        // stays correct under seeks that suppress callbacks
        let countV = 0;
        const counter = {
          get v() { return countV; },
          set v(x) { countV = x; numEl.textContent = Math.round(x).toLocaleString("en-US"); }
        };
        tl.fromTo(counter, { v: 0 }, { v: 2148216, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);
        tl.fromTo(numEl, { opacity: 0 },
          { opacity: 1, duration: 0.12, ease: "power1.out" }, COUNT_AT);
        tl.fromTo(numEl, { scale: 0.5 },
          { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);

        // landing (2.3): one teal flash + the highlight bar sweeps behind the amount
        const LAND = COUNT_AT + COUNT_DUR;
        tl.fromTo('[id="f04-total"]', { color: INK },
          { color: TEAL, duration: 0.08, ease: "none" }, LAND - 0.04);
        tl.to('[id="f04-total"]', { color: INK, duration: 0.5, ease: "power2.out" }, LAND + 0.06);
        tl.fromTo('[id="f04-hl"]', { scaleX: 0 },
          { scaleX: 1, duration: 0.45, ease: "power3.out" }, LAND - 0.08);

        // ── Scene 3 (2.5–3.6): title swaps in place, discrete states ──
        const OLD_SEQ = [
          { t: 0, text: "你有多少錢？" },
          { t: 2.5, text: "你有多少錢" },
          { t: 2.56, text: "你有多少" },
          { t: 2.62, text: "你有多" },
          { t: 2.68, text: "你有" },
          { t: 2.74, text: "你" },
          { t: 2.8, text: "" }
        ];
        const NEW_SEQ = [
          { t: 0, html: "" },
          { t: 2.94, html: "打開" },
          { t: 3.08, html: '打開<span class="f04-teal">1</span>' },
          { t: 3.16, html: '打開<span class="f04-teal">1</span>個' },
          { t: 3.3, html: '打開<span class="f04-teal">1</span>個App' },
          { t: 3.44, html: '打開<span class="f04-teal">1</span>個App就好' }
        ];
        function at(seq, time) {
          for (let i = seq.length - 1; i >= 0; i--) if (time >= seq[i].t) return seq[i];
          return seq[0];
        }
        const oldText = document.querySelector('[id="f04-title-old-text"]');
        const newText = document.querySelector('[id="f04-title-new-text"]');
        const caretOld = document.querySelector('[id="f04-caret-old"]');
        const caretNew = document.querySelector('[id="f04-caret-new"]');
        let lastOld = null, lastNew = null;
        function renderTitle(time) {
          const o = at(OLD_SEQ, time).text;
          const n = at(NEW_SEQ, time).html;
          if (o !== lastOld) { oldText.textContent = o; lastOld = o; }
          if (n !== lastNew) { newText.innerHTML = n; lastNew = n; }
          // caret: on the old line while it erases, on the new line while it types; gone at 3.7
          const on = Math.sin((time - 2.4) * Math.PI * 2 / 0.6) >= 0 ? "1" : "0";
          const inOld = time >= 2.4 && time < 2.87;
          const inNew = time >= 2.87 && time < 3.7;
          caretOld.style.opacity = inOld ? (time < 2.8 ? "1" : on) : "0";
          caretNew.style.opacity = inNew ? (time < 3.44 ? "1" : on) : "0";
        }
        let driverT = 0;
        const driver = {
          get t() { return driverT; },
          set t(x) { driverT = x; renderTitle(x); }
        };
        tl.fromTo(driver, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
        renderTitle(0);

        // ── Scene 4 (3.6–5.0): hold — only the rosette turns ──
        tl.set({}, {}, DUR);
        window.__timelines["04-total"] = tl;
      })();
    </script>
