        const tl = gsap.timeline({ paused: true });

        const DUR = 3.5;

        // Ground: rosette angle is film-continuous — 0.6°/s × (frameStart + t).

          { rotation: DEG_PER_S * (FRAME_START + DUR), duration: DUR, ease: "none" },

          $("word"),
