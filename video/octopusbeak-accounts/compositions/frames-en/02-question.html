    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var $ = function (id) {
          return document.getElementById("02-question-" + id);
        };
        var tl = gsap.timeline({ paused: true });
        var FRAME_START = 6; // film time of this frame (F2)
        var DUR = 5;

        // Ground: rosette turns 0.6 deg/s of film time.
        tl.fromTo(
          $("rosette"),
          { rotation: 0.6 * FRAME_START, transformOrigin: "50% 50%" },
          { rotation: 0.6 * (FRAME_START + DUR), duration: DUR, ease: "none" },
          0,
        );

        // Scene 1 (0.0-0.6): frame 1's lines and labels lift 60px and fade; its three tiles glide to grid slots, 220 -> 200.
        var root = document.querySelector('[data-composition-id="02-question"]');
        var olds = root.querySelectorAll(".\\30 2-question-oldline, .\\30 2-question-label");
        olds.forEach(function (el, i) {
          tl.to(el, { y: -60, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.03 * i);
        });
        var CARRY = [
          { k: "fubon", dx: 0, dy: 80 }, // (260,1060) -> (260,980)
          { k: "yuanta-securities", dx: 280, dy: 80 }, // (820,1060) -> (540,980)
          { k: "esun", dx: -280, dy: -180 }, // (540,1060) -> (820,1240)
        ];
        CARRY.forEach(function (c) {
          tl.fromTo($("tile-" + c.k), { x: c.dx, y: c.dy, scale: 1.1 }, { x: 0, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0);
          // counter-scale keeps the logo at 120px while the tile shrinks
          tl.fromTo($("logo-" + c.k), { scale: 1 / 1.1 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0);
        });

        // Scene 2 (0.4-1.6): the question, waterfall-entry (binary opacity, whip up from below, overlapping).
        var F = 1 / 60;
        var WORDS = [{id:"w0",y:80,d:0.18},{id:"w1",y:48,d:0.15},{id:"w2",y:80,d:0.18},{id:"w3",y:36,d:0.11},{id:"w4",y:80,d:0.18},{id:"w5",y:48,d:0.15},{id:"w6",y:48,d:0.15},{id:"w7",y:40,d:0.12}];
        var wt = 0.42;
        WORDS.forEach(function (w, i) {
          var el = $(w.id);
          tl.set(el, { opacity: 0, y: w.y }, 0);
          tl.set(el, { opacity: 1 }, wt);
          tl.to(el, { y: 0, duration: w.d, ease: "power4.out" }, wt);
          wt += w.d - F;
        });
        // ... meanwhile MaiCoin, 元大銀行, 國泰世華 pop into their slots (spring-pop, smooth settle).
        ["maicoin", "yuanta-bank", "cathay"].forEach(function (k, i) {
          tl.fromTo(
            $("tile-" + k),
            { scale: 0, opacity: 0, y: 24 },
            { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            0.62 + 0.12 * i,
          );
        });

        // Scene 3 (1.6-4.2): tap each tile in grid order every 0.42s; a login card flips up, holds, folds back.
        var ORDER = ["fubon", "yuanta-securities", "maicoin", "yuanta-bank", "cathay", "esun"];
        var TAPS = ORDER.map(function (_, i) {
          return 1.7 + 0.42 * i;
        });
        ORDER.forEach(function (k, i) {
          var T = TAPS[i];
          var tile = $("tile-" + k);
          var rip = $("ripple-" + i);
          var card = $("card-" + i);
          tl.set(rip, { opacity: 0, scale: 0.4 }, 0);
          tl.fromTo(rip, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.55, duration: 0.5, ease: "power2.out", immediateRender: false }, T);
          tl.to(tile, { scale: 0.92, duration: 0.08, ease: "power2.out" }, T);
          tl.to(tile, { scale: 1, duration: 0.3, ease: "power3.out" }, T + 0.08);
          tl.fromTo(
            card,
            { rotationX: 90, opacity: 0, transformPerspective: 900 },
            { rotationX: 0, opacity: 1, duration: 0.2, ease: "power3.out" },
            T + 0.06,
          );
          card.querySelectorAll(".\\30 2-question-dot").forEach(function (d, j) {
            tl.set(d, { opacity: 0 }, 0);
            tl.set(d, { opacity: 1 }, T + 0.1 + 0.03 * j);
          });
          tl.to(card, { rotationX: 90, opacity: 0, duration: 0.16, ease: "power2.in" }, T + 0.56);
        });

        // Counter 「已打開」 1 -> 6 in lockstep with the taps (discrete-text-sequence); warm alarm from 5.
        // Each state holds from its tap until the next: stacked numerals swapped by instant sets (seek-safe, no callbacks).
        var num = $("num");
        TAPS.forEach(function (T, i) {
          tl.set($("n" + i), { opacity: i === 0 ? 1 : 0 }, 0);
          if (i === 0) return;
          tl.set($("n" + (i - 1)), { opacity: 0 }, T);
          tl.set($("n" + i), { opacity: 1 }, T);
        });
        tl.fromTo($("counter"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.62);
        TAPS.forEach(function (T, i) {
          if (i === 0) return;
          tl.fromTo(num, { scale: 1.18 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, T);
        });

        // Scene 4 (4.2-5.0): question and counter fade; the six tiles hold at the grid for the handoff.
        tl.to($("qwrap"), { opacity: 0, y: -40, duration: 0.5, ease: "power2.inOut" }, 4.2);
        tl.to($("cwrap"), { opacity: 0, y: -24, duration: 0.45, ease: "power2.inOut" }, 4.25);

        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines["02-question"] = tl;
      })();
    </script>
