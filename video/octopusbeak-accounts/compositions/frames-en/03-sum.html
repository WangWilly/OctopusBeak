        tl.fromTo(tile,
          { x: gx - 158, y: gy - ry, scale: START_SCALE, borderRadius: 46 / START_SCALE,
            boxShadow: "0px " + (18 / START_SCALE) + "px " + (36 / START_SCALE) + "px rgba(0, 0, 0, 0.30)" },
          { x: 0, y: 0, scale: 1, borderRadius: 24,
            boxShadow: "0px 10px 24px rgba(15, 23, 42, 0.14)", duration: 0.75, ease: "power3.out" }, at);
        tl.fromTo(tile.querySelector(".f03sum-logo"),
          { scale: 120 / (72 * START_SCALE) }, { scale: 1, duration: 0.75, ease: "power3.out" }, at);
      }

      // Scene 2 (0.8-1.8): title rises in; labels print left->right; teal "?" pop in.
      tl.fromTo($("f03sum-title"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.8);
      for (var j = 0; j < 6; j++) {
        var lab = $("f03sum-label-" + j);
        var n = +lab.getAttribute("data-n");
        tl.fromTo(lab,
          { clipPath: "inset(-20% 100% -20% -4%)" },
          { clipPath: "inset(-20% -4% -20% -4%)", duration: 0.08 * n + 0.08, ease: "steps(" + n + ")" },
          1.0 + j * 0.08);
        tl.fromTo($("f03sum-q-" + j).querySelector(".f03sum-qi"),
          { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.15 + j * 0.06);
      }
      tl.fromTo($("f03sum-plus"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.45);

      // Scene 3 (1.9-2.4): the OctopusBeak icon drops from above and stamps at (900,360); 3px page shake.
      tl.fromTo($("f03sum-icon"),
        { y: -560, scale: 1.3, rotation: -16, opacity: 0 },
        { y: 0, scale: 1, rotation: -6, opacity: 1, duration: 0.45, ease: "expo.out" }, 1.9);
      var world = $("f03sum-world");
      tl.fromTo(world, { x: 0, y: 0 }, { x: 3, y: 3, duration: 0.04, ease: "none" }, 1.98)
        .to(world, { x: -3, y: -2, duration: 0.05, ease: "none" }, 2.02)
        .to(world, { x: 2, y: 1, duration: 0.05, ease: "none" }, 2.07)
        .to(world, { x: -1, y: 0, duration: 0.05, ease: "none" }, 2.12)
        .to(world, { x: 0, y: 0, duration: 0.06, ease: "power2.out" }, 2.17);

      // Scene 4 (2.5-5.4): row by row, each "?" rolls up into the real amount as a stepped odometer.
      var STEP_SPACING = 0.08, STEP_DUR = 0.16;
      for (var r = 0; r < 6; r++) {
        var land = 2.5 + r * 0.45;
        var amt = $("f03sum-amt-" + r);
        var neg = amt.classList.contains("f03sum-neg");
        tl.fromTo($("f03sum-q-" + r), { y: 0 }, { y: -ITEM_H, duration: 0.24, ease: "power3.out" }, land);
        tl.fromTo(amt, { color: "#18a9a4" }, { color: neg ? "#8a3b2e" : "#0e1217", duration: 0.4, ease: "power2.out" }, land);
        var cols = amt.querySelectorAll(".f03sum-col");
        // Stepped odometer: each column nests one wrapper per step; every wrapper rolls one item
        // height (power3.out) and the nested translations add up, so overlapping steps sum into
        // a click-click-click roll that stays exact under any seek.
        cols.forEach(function (col, c) {
          var steps = col.querySelectorAll(".f03sum-step");
          var colAt = land + c * 0.012 + (steps.length === 1 ? 3 * STEP_SPACING : 0);
          steps.forEach(function (stepEl, s) {
            tl.fromTo(stepEl, { y: 0 }, { y: -ITEM_H, duration: STEP_DUR, ease: "power3.out" }, colAt + s * STEP_SPACING);
          });
        });
        // thin teal check flicks at the row's right edge as it lands
        var chk = $("f03sum-check-" + r);
        var path = chk.querySelector("path");
        tl.fromTo(chk, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, land + 0.3);
        tl.fromTo(path, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.18, ease: "power3.out" }, land + 0.3);
        tl.to(chk, { opacity: 0, duration: 0.25, ease: "power2.in" }, land + 0.62);
      }

      // Scene 5 (5.4-6.0): hold; only the rosettes keep turning.
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-sum"] = tl;
    })();
  </script>
</template>
