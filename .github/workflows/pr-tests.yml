name: PR Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.9.0
          cache: npm

      - name: Validate Welcome assets
        run: npm run check:welcome-assets

      - name: Install dependencies
        run: npm ci

      - name: Check package lock
        run: npm run check:package-lock

      - name: Check pinned GitHub Actions
        run: npm run check:actions-pinned

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Install Electron Secret Service dependencies
        run: sudo apt-get install --yes gnome-keyring dbus-x11 libsecret-1-0

      - name: Run tests
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run --auto-servernum bash scripts/run-linux-ci-tests.sh

      - name: Publish job summary
        if: always()
        run: |
          if [ ! -f reports/test-summary.txt ]; then
            echo '## Partial test reports' >> "$GITHUB_STEP_SUMMARY"
            for report in reports/test-summary-*.txt; do
              if [ -f "$report" ]; then
                cat "$report" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
            exit 0
          fi
          echo '## Test and coverage report' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat reports/test-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            reports/test-summary.txt
            reports/junit.xml
            reports/test-summary-*.txt
            reports/junit-*.xml
          if-no-files-found: error
          retention-days: 14
