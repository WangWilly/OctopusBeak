# PR Tests runs the same check in the unit lane. This covers main and quiet
# weeks with no pull request: the Yuanta settlement calendar needs a yearly
# update (docs/runbooks/yuanta-settlement-calendar.md).
name: Settlement calendar expiry

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry:
    name: Yuanta settlement calendar coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.9.0

      - name: Check calendar coverage
        run: node --no-warnings --experimental-strip-types --test src/ledger/canonical/yuanta-foreign-settlement-calendar-expiry.check.ts
